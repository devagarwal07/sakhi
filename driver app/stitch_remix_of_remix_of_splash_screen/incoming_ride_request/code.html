<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .timer-bar-deplete {
            animation: deplete 15s linear forwards;
        }
        @keyframes deplete {
            from { width: 100%; }
            to { width: 0%; }
        }
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
        }
        .shadow-lavender {
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- Main Canvas (390x844 Frame Emulation) -->
<main class="relative mx-auto w-full max-w-[390px] h-screen bg-background overflow-hidden flex flex-col">
<!-- Shared Component: TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-violet-600">menu</span>
<h1 class="font-['Inter'] font-semibold tracking-tight text-lg text-slate-900">New Request</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-violet-600">history</span>
</div>
</header>
<!-- Top 50%: Map Section -->
<section class="relative h-1/2 w-full overflow-hidden">
<img class="w-full h-full object-cover grayscale opacity-40" data-alt="Pastel styled map with a purple route line" data-location="Mumbai" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDRq4ep5VtvzuGrLXZpC6RD5zaWeIKIdczAMC8HUdcf09ZwMSsldLwBAGqp1HTUBIiD3ymiu0utHVQQy5LF-t0q-BrxWTMepkNRzi4z0rQFh6amfCKIluGddELiN0RFDTcgzRAQgf8nw6B-Ef7Vum4Nww585R0Ujzke5ocVpKlYpHOU9OuwTxQcPsPiRETrLi5DkfI_p9sJpRjh4nXUTF4q7Bg7IUI8gJ1qPwvZ1soIKbI1lqmSCQ_UNQuYoZu_R9RMjep7kPpwyRZL"/>
<!-- Map Overlay Route Simulation (Simplified) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<svg class="opacity-90" fill="none" height="240" viewbox="0 0 280 240" width="280" xmlns="http://www.w3.org/2000/svg">
<!-- Pickup Pin Shadow -->
<circle cx="60" cy="180" fill="#10B981" fill-opacity="0.2" r="8"></circle>
<!-- Route -->
<path d="M60 180C100 180 120 60 220 60" stroke="#7C3AED" stroke-dasharray="12 12" stroke-linecap="round" stroke-width="6"></path>
<!-- Pins -->
<circle cx="60" cy="180" fill="#10B981" r="10" stroke="white" stroke-width="3"></circle>
<path d="M220 40C220 40 210 55 210 65C210 70.5228 214.477 75 220 75C225.523 75 230 70.5228 230 65C230 55 220 40 220 40Z" fill="#7C3AED" stroke="white" stroke-width="2"></path>
</svg>
</div>
</section>
<!-- Bottom Sheet: Request Details (Bottom 50%) -->
<section class="absolute bottom-0 w-full h-1/2 bg-surface-container-lowest rounded-t-[24px] shadow-lavender z-40 flex flex-col p-6">
<!-- Pulse Header -->
<div class="flex flex-col items-center mb-4">
<div class="relative flex items-center justify-center mb-1">
<div class="absolute w-10 h-10 bg-primary/20 rounded-full pulse-ring"></div>
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
<h2 class="text-on-surface font-headline font-extrabold text-xl tracking-tight">New Ride Request 🔔</h2>
</div>
<!-- Depleting Timer Bar -->
<div class="w-full h-1.5 bg-surface-container rounded-full overflow-hidden mb-6">
<div class="h-full bg-primary-container timer-bar-deplete"></div>
</div>
<!-- Inner Ride Card -->
<div class="bg-surface-container-lowest rounded-2xl p-4 shadow-lavender flex flex-col gap-4 mb-6">
<!-- Rider Profile Row -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full border-2 border-surface-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="Profile photo of a smiling woman" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGwrWIf-ufGBlLEnB_K81n1QYrtY3D6_Bfi2S4saJQhPMVz0m9c_iOkH-lD5g6P9hmf8yMkmWG97lkVwhpUE1wKgUDO8x-08JZO1DChXbr07Of1yjI8EbsayZOp5AocNfj5ZNuQrDcI2C9y5eYSArIssJ6rD3yY8VnKq6TGNEpmJd8LSeQ7EySzh8Z4v06-0227EwWSiLCz346Sg-K0_0wn69N4pUNSmDv6qWoBwu8icYATYX3nv8TihIKtZH4nqQFKHw5T0Mbn-Nh"/>
</div>
<div>
<p class="font-bold text-on-surface">Priya S.</p>
<div class="flex items-center text-xs text-subtext gap-1">
<span class="material-symbols-outlined text-[14px] text-amber-500" style="font-variation-settings: 'FILL' 1;">star</span>
<span>4.7</span>
</div>
</div>
</div>
<div class="text-right">
<p class="text-2xl font-black text-primary tracking-tighter">₹87</p>
</div>
</div>
<!-- Separation through whitespace (Design System Mandate) -->
<!-- Route Info -->
<div class="flex flex-col gap-3">
<div class="flex gap-4 items-start relative">
<div class="flex flex-col items-center mt-1.5 shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
<div class="w-0.5 h-8 bg-surface-container-highest my-1"></div>
<span class="material-symbols-outlined text-primary text-[18px]">location_on</span>
</div>
<div class="flex-1">
<div class="mb-3">
<p class="text-xs uppercase tracking-widest text-subtext font-label font-medium">Pickup</p>
<p class="text-sm font-semibold text-on-surface">Versova Metro Station</p>
</div>
<div>
<p class="text-xs uppercase tracking-widest text-subtext font-label font-medium">Drop-off</p>
<p class="text-sm font-semibold text-on-surface">Oberoi Mall, Goregaon</p>
</div>
</div>
</div>
</div>
<!-- Trip Stats -->
<div class="flex items-center justify-between pt-2">
<div class="flex items-center gap-2 text-subtext">
<span class="material-symbols-outlined text-[18px]">route</span>
<span class="text-xs font-medium">3.2 km to pickup</span>
</div>
<div class="flex items-center gap-2 text-subtext">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span class="text-xs font-medium">ETA ~6 min</span>
</div>
</div>
</div>
<!-- Action Buttons Stacked -->
<div class="mt-auto flex flex-col gap-3">
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-white font-bold rounded-xl shadow-lg active:scale-95 transition-transform duration-150">
                    Accept Ride
                </button>
<button class="w-full py-4 bg-surface-container-lowest border-2 border-error text-error font-bold rounded-xl active:scale-95 transition-transform duration-150">
                    Decline
                </button>
</div>
</section>
<!-- No BottomNavBar per requirements for priority interrupt screen -->
</main>
</body></html>
