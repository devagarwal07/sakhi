<body class="bg-[#F5F0FF] text-on-surface min-h-screen flex flex-col items-center">

<h1 class="text-[2rem] font-extrabold text-[#1E1B2E] leading-tight tracking-tight mb-2">
                    Welcome, Driver

</div>

<input class="bg-transparent w-full h-full text-[#1E1B2E] font-medium placeholder:text-outline/50 border-none p-0 focus:ring-0" maxlength="10" placeholder="Phone number" type="tel"/>
</div>
</div>
