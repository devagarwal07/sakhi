<!DOCTYPE html>

<html lang="en"><head>

              "on-surface": "#1c1a25",
              "secondary-fixed-dim": "#cebdff",
              "on-secondary-fixed": "#21005e",
              "error-container": "#ffdad6",
              "surface-variant": "#e5e0ef",

              "surface": "#fcf8ff",
              "secondary-fixed": "#e8ddff",
              "primary-container": "#7c3aed",
              "on-primary-fixed-variant": "#5a00c6"

            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]

            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-lavender-shadow {
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
        }
        .dashed-border {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='12' ry='12' stroke='%23A78BFA' stroke-width='2' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            border-radius: 12px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F5F0FF] text-on-surface min-h-screen flex justify-center">
<!-- Main Viewport Container (390x844 simulated) -->
<main class="w-[390px] min-h-[844px] bg-[#F5F0FF] relative flex flex-col overflow-hidden">
<!-- TopAppBar Shared Component Execution -->
<header class="fixed top-0 w-[390px] z-50 bg-[#F5F0FF]/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-200 p-1 rounded-full hover:bg-white/50 transition-colors">
<span class="material-symbols-outlined text-[#7C3AED] text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-semibold tracking-tight text-[#1E1B2E] text-lg">Driving Licence</h1>
</div>
</header>
<!-- Content Canvas -->
<div class="pt-24 px-6 pb-32 flex-1 flex flex-col gap-8">
<!-- Current Document Card -->
<section class="bg-surface-container-lowest rounded-[16px] p-6 soft-lavender-shadow flex flex-col gap-4">
<div class="flex justify-between items-center">
<span class="text-[0.7rem] font-bold tracking-[0.05em] text-on-surface-variant uppercase">CURRENT DOCUMENT</span>
</div>
<div class="relative w-full aspect-[16/10] bg-surface-container rounded-xl overflow-hidden group border border-outline-variant/20">
<img alt="Document Preview" class="w-full h-full object-cover opacity-60 grayscale-[40%]" data-alt="Blurred driver license document with expiration notice" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAPXc6jWplAsuKCcUx6CoDUPDwvo_tXFQx_IYffyqSOCAKZgmmfDPGNEYdVzcIDfPKMkcr5v_YzT63ComeTytd2kRMUQjrhmkXm2WPsHq5ICkz1RnKP98C8uQnB40V_zHhDxoAw1uFgOG9JqkimOAexNiTvfe7eFPlkXocRk5Cs7q9Je1y6KOgIvVPzI6cMMPsZkVYMvJG0NddlDtVdpJ5qRlHK_iKnKJ-eCiOVZSpd66x4-Zwo7-RGhkyGsJQG4fmkonvS8R0ty2-y"/>
<!-- Status Pill -->
<div class="absolute top-3 right-3 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
<span class="text-[10px] font-bold text-error uppercase">Expired ❌</span>
</div>
</div>
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-error text-[18px]" data-icon="error_outline">error_outline</span>
<span class="text-xs font-medium text-error">Expired: 10 Jan 2026</span>
</div>
</section>
<!-- Divider -->
<div class="h-[1px] w-full bg-[#A78BFA]/20"></div>
<!-- New Upload Section -->
<section class="flex flex-col gap-4">
<h2 class="text-sm font-bold text-on-surface">Upload New Document</h2>
<div class="grid grid-cols-2 gap-4">
<!-- Front Side -->
<div class="dashed-border bg-white p-5 flex flex-col items-center justify-center text-center gap-2 min-h-[160px] active:scale-[0.98] transition-transform cursor-pointer">
<div class="bg-[#F5F0FF] p-2 rounded-full mb-1">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="cloud_upload">cloud_upload</span>
</div>
<span class="text-[13px] font-semibold text-on-surface">Front</span>
<span class="text-[10px] text-on-surface-variant">Tap to upload</span>
<div class="mt-2 bg-[#F5F0FF] text-[#7C3AED] px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                            Upload Photo
                        </div>
</div>
<!-- Back Side -->
<div class="dashed-border bg-white p-5 flex flex-col items-center justify-center text-center gap-2 min-h-[160px] active:scale-[0.98] transition-transform cursor-pointer">
<div class="bg-[#F5F0FF] p-2 rounded-full mb-1">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="cloud_upload">cloud_upload</span>
</div>
<span class="text-[13px] font-semibold text-on-surface">Back</span>
<span class="text-[10px] text-on-surface-variant">Tap to upload</span>
<div class="mt-2 bg-[#F5F0FF] text-[#7C3AED] px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                            Upload Photo
                        </div>
</div>
</div>
</section>
<!-- Info Message -->
<div class="flex items-start gap-3 bg-surface-container-low p-4 rounded-xl mt-2">
<span class="material-symbols-outlined text-outline text-[18px] mt-0.5" data-icon="lock">lock</span>
<p class="text-[11px] leading-relaxed text-on-surface-variant font-medium">
                    Documents are auto-verified. Manual review takes up to 24 hours.
                </p>
</div>
</div>
<!-- Sticky Footer CTA -->
<div class="fixed bottom-0 w-[390px] p-6 bg-gradient-to-t from-[#F5F0FF] via-[#F5F0FF] to-transparent">
<button class="w-full h-14 rounded-xl bg-[#7C3AED] opacity-40 text-white font-bold text-[15px] flex items-center justify-center cursor-not-allowed" disabled="">
                Submit for Re-verification
            </button>
</div>
</main>
</body></html>
