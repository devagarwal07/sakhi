<!DOCTYPE html>

<html class="light" lang="en"><head>

              "on-secondary-container": "#2c283a",
              "tertiary-container": "#a15100",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#ebe6f5",
              "primary-fixed": "#eaddff",
              "on-tertiary-container": "#ffe0cd",

              "primary-fixed-dim": "#d2bbff",
              "secondary-fixed": "#e8ddff",
              "tertiary-fixed": "#ffdcc6",
              "on-tertiary-fixed": "#301400",

              "on-surface-variant": "#4a4455",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "tertiary": "#7d3d00"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .map-gradient-overlay {
        background: linear-gradient(to bottom, rgba(245,240,255,0.4) 0%, rgba(245,240,255,0) 20%, rgba(245,240,255,0) 80%, rgba(245,240,255,1) 100%);
      }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased selection:bg-primary-container/30">
<!-- Mobile Container (390x844 simulated) -->
<main class="relative mx-auto h-[844px] w-[390px] overflow-hidden bg-surface shadow-2xl">
<!-- Map Section (Top 62%) -->
<section class="absolute inset-0 h-[62%] w-full overflow-hidden bg-surface-dim">
<div class="relative h-full w-full">
<!-- Mock Map Image -->
<img class="h-full w-full object-cover" data-alt="Modern minimalist city map with route line" data-location="Broadway, New York" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDlyO8IFhP9b_gJQ3yKO4aNSpmv_b4XCdToRlgzHRELb5d-HZVyW-T3mFGdlUyik-GWejvwwW8GmKGPZB48DJO86scOEfxkyCinZ8UrrtW3QBUf1-NzI_Us1plFtUgXd2vwHcUji-yFpIVOKzG2HJXYkmaAOTcqLt-fNzk_bvQuYbcD1QnEMtOKu8MiIacDFnmDxMdPxTLKrsGhrZgYZAm6CnVZoR5tl4bPugdPupWUJgCvx1fXyBA89yYXi_dVoEpEiyZxtjsZYTRp"/>
<!-- Map Overlays -->
<div class="map-gradient-overlay absolute inset-0"></div>
<!-- SOS Floating Pill -->
<button class="absolute bottom-6 left-6 z-10 flex items-center gap-2 rounded-full bg-error px-4 py-2 text-on-error shadow-lg shadow-error/20 transition-transform active:scale-90">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">emergency</span>
<span class="font-label text-xs font-bold tracking-wider uppercase">SOS</span>
</button>
</div>
</section>
<!-- Top Navigation Banner -->
<nav class="fixed top-4 left-4 right-4 z-50 rounded-2xl bg-white/90 backdrop-blur-xl shadow-lg shadow-primary/10 flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/20 text-primary-container">
<span class="material-symbols-outlined" data-icon="navigation">navigation</span>
</div>
<div>
<h1 class="font-inter font-bold tracking-tight text-lg text-on-surface">Heading North on Broadway</h1>
<p class="text-xs text-outline">Straight for 1.2km on Broadway</p>
</div>
</div>
<button class="flex h-10 w-10 items-center justify-center rounded-xl hover:bg-primary/10 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined text-outline" data-icon="close">close</span>
</button>
</nav>
<!-- Bottom Sheet (38% Height) -->
<section class="absolute bottom-0 left-0 z-20 h-[38%] w-full rounded-t-[32px] bg-surface-container-lowest shadow-[0_-16px_48px_rgba(192,166,214,0.12)]">
<div class="flex h-full flex-col p-8">
<!-- Drag Handle -->
<div class="mx-auto mb-6 h-1 w-12 rounded-full bg-surface-container-highest"></div>
<!-- Rider & Status Row -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="relative">
<img class="h-14 w-14 rounded-2xl object-cover shadow-sm" data-alt="Close up portrait of Priya S smiling" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBA20xuSg4IlgvC4XJhDKyghfPJP-fwAwrH4f3tU4OAHfIvOFH9jF0XUW2ZjyRiO9cDUbgUs8gCkdEIhziU8AaAo3JuwyE2Pkoyx0_B_Opys7pNOfhyEqD11ot9mZMtEpnUrBpNqWxK7sD_Vo9ze7zSuyZB449mAhqQC0KgGgoBH0agwDeGBi3vZXVnEXqWtd3iwyhBB3p4EHkk-lvK8I8hGUwRMvt63drKPWMcpSVi8t635OV2OAwG3zQcHCZE6sLm6aaDvczi33Li"/>
<div class="absolute -bottom-1 -right-1 flex h-6 w-10 items-center justify-center rounded-lg bg-surface-container-highest text-[10px] font-bold text-on-surface-variant shadow-sm">
                                4.7 ★
                            </div>
</div>
<div>
<h2 class="font-headline text-xl font-extrabold tracking-tight text-on-surface">Priya S.</h2>
<div class="mt-1 inline-flex items-center rounded-full bg-primary/10 px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-wider text-primary-container">
                                Trip In Progress
                            </div>
</div>
</div>
<div class="flex gap-2">
<button class="flex h-12 w-12 items-center justify-center rounded-2xl bg-surface-container-low text-primary-container transition-all hover:bg-primary/10 active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
</button>
</div>
</div>
<!-- Trip Details Section -->
<div class="mt-8 flex-1">
<div class="flex items-start gap-4 rounded-2xl bg-surface-container-low p-4">
<div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/20 text-primary-container">
<span class="material-symbols-outlined">location_on</span>
</div>
<div>
<span class="font-label text-[10px] font-bold uppercase tracking-widest text-outline">Destination</span>
<p class="font-headline font-semibold text-on-surface">MG Road Metro Station</p>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="mt-auto">
<button class="w-full rounded-xl bg-gradient-to-br from-primary to-primary-container py-4 font-headline text-base font-bold text-on-primary shadow-lg shadow-primary/20 transition-all hover:-translate-y-0.5 active:scale-[0.98]">
                        Complete Trip
                    </button>
</div>
</div>
</section>
</main>
<!-- Material Symbols Injection -->
<script>
        document.querySelectorAll('[data-icon]').forEach(el => {
            const iconName = el.getAttribute('data-icon');
            const weight = el.getAttribute('data-weight');
            const span = document.createElement('span');
            span.className = 'material-symbols-outlined';
            span.textContent = iconName;
            if (weight === 'fill') {
                span.style.fontVariationSettings = "'FILL' 1";
            }
            el.innerHTML = '';
            el.appendChild(span);
        });
    </script>
</body></html>
