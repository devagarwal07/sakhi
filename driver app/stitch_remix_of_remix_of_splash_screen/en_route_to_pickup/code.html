<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; background-color: #fcf8ff; }
        .map-gradient-overlay {
            background: linear-gradient(180deg, rgba(252,248,255,0.4) 0%, rgba(252,248,255,0) 20%, rgba(252,248,255,0) 80%, rgba(252,248,255,1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased text-on-background overflow-hidden">
<!-- Top Navigation Shell (Shared Component: TopAppBar) -->
<header class="fixed top-4 left-4 right-4 rounded-2xl bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 z-50 tonal-nesting shadow-lg shadow-violet-500/10 shadow-[16px_32px_rgba(124,58,237,0.08)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-violet-700 dark:text-violet-400" data-icon="navigation">navigation</span>
<h1 class="font-inter font-bold tracking-tight text-lg text-violet-900 dark:text-white">Heading North on Broadway</h1>
</div>
<button class="hover:bg-violet-50 dark:hover:bg-violet-900/30 transition-all active:scale-95 duration-200 p-1 rounded-full">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400" data-icon="close">close</span>
</button>
</header>
<main class="relative h-screen w-full flex flex-col">
<!-- Map Section (62%) -->
<section class="relative h-[62%] w-full overflow-hidden">
<!-- Simulated Map Image -->
<img class="w-full h-full object-cover" data-alt="Modern map view with violet navigation route line" data-location="Bangalore" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPZoasuZtF9j6bb7xnb8CMXtpperX6QGlQjZ6dr4fMpIfI4MmACxxQ8MV7aakjvXtK3uTCpsCiwQjKGtUfJNfEF9tkqQUecgJr1xx28svb1cxwl8p-FcplR1x676eQLqo3F4VXojntW4oYHfX_NZtycZRZsAT4OBzn8r0RmknzIPb4KusFMdfsMvZ8CIaKTR5cwiBBL4Oa-DYgGjWZTr73cqynlIJ7FZPyUzDBGOv_zae-eGQZXrbC85DqghEJ_nTI2fEnX641MdX5"/>
<div class="absolute inset-0 map-gradient-overlay pointer-events-none"></div>
<!-- Route Visual (Abstract representation) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 390 523">
<path class="opacity-80" d="M195 523 L195 400 L300 350 L320 200 L150 150" fill="none" stroke="#7c3aed" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
<circle cx="150" cy="150" fill="#7c3aed" r="10"></circle>
<circle class="opacity-20" cx="150" cy="150" fill="#7c3aed" r="18"></circle>
</svg>
<!-- Navigation Instruction Banner -->
<div class="absolute top-24 left-4 right-4 z-10">
<div class="bg-surface-container-lowest rounded-2xl shadow-[16px_32px_rgba(124,58,237,0.08)] p-5 flex items-center gap-4">
<div class="bg-primary-container p-3 rounded-xl flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-3xl" data-icon="turn_left">turn_left</span>
</div>
<div>
<p class="text-on-background font-headline font-bold text-lg leading-tight">Turn left onto MG Road</p>
<p class="text-subtext font-label text-sm uppercase tracking-wider mt-1">200m</p>
</div>
</div>
</div>
<!-- SOS Floating Button -->
<div class="absolute bottom-6 left-4 z-10">
<button class="bg-error text-on-error flex items-center gap-2 px-4 py-2 rounded-full font-label font-bold text-xs uppercase tracking-widest shadow-lg shadow-error/20 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-lg" data-icon="emergency" style="font-variation-settings: 'FILL' 1;">emergency</span>
                    SOS
                </button>
</div>
<!-- Map Layer Controls -->
<div class="absolute bottom-6 right-4 z-10 flex flex-col gap-3">
<button class="w-12 h-12 bg-white/90 backdrop-blur-md rounded-xl flex items-center justify-center text-primary shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
</button>
</div>
</section>
<!-- Bottom Sheet (38%) -->
<section class="h-[38%] bg-surface-container-low rounded-t-[40px] shadow-[0_-16px_48px_rgba(124,58,237,0.12)] relative z-20 flex flex-col px-8 pt-2 pb-10">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-surface-container-highest rounded-full mx-auto mt-3 mb-6"></div>
<div class="flex-1 space-y-8">
<!-- Status Pill -->
<div class="flex justify-center">
<span class="bg-secondary-container/20 text-on-secondary-container px-4 py-1.5 rounded-full font-label text-xs font-bold tracking-widest uppercase">
                        En Route to Pickup
                    </span>
</div>
<!-- Rider Information Row -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="relative">
<img class="w-14 h-14 rounded-2xl object-cover shadow-md" data-alt="Portrait of Priya S. rider profile" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBbRyLnz5avaa1h7bJUIxKmhdSmRYfzPH-pYsz2w354v4Jy3jmuqFF-3EsewOcB9cdaos4n_IPAPmc-KFMrTZlFoqx_dA6ETQG24-FDAteigDXmIS7DTiFq7m2i8qW68fswBSVter2A2F67RVpLNbM7rGYSIKjXIUGpMzmm5YQEns4DODOVyabVBLSCITK3Ko9zsGkYNmvg1hJpGFb-3WyYTWHKmeUHmuUKFgXTfErjvE719nERNbuyii_DDQhhtlkb0d_kt7wMHFuJ"/>
<div class="absolute -bottom-1 -right-1 bg-white p-1 rounded-lg shadow-sm flex items-center">
<span class="material-symbols-outlined text-xs text-yellow-500" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<div>
<h3 class="font-headline font-extrabold text-xl text-on-background">Priya S.</h3>
<div class="flex items-center gap-1.5 mt-0.5">
<span class="text-on-surface-variant font-medium text-sm">4.7</span>
<span class="text-outline text-xs">•</span>
<span class="text-on-surface-variant text-sm">Premium Class</span>
</div>
</div>
</div>
<button class="w-12 h-12 rounded-2xl bg-secondary-container text-on-secondary-container flex items-center justify-center hover:bg-secondary-container/80 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="call" style="font-variation-settings: 'FILL' 1;">call</span>
</button>
</div>
<!-- Primary Action -->
<button class="w-full bg-gradient-to-br from-primary-container to-primary py-5 rounded-2xl text-on-primary font-headline font-bold text-lg shadow-[0_12px_24px_rgba(124,58,237,0.2)] active:scale-[0.98] transition-all">
                    I've Arrived at Pickup
                </button>
</div>
</section>
</main>
<!-- Navigation Shell (Shared Component: BottomNavBar) -->
<!-- Prohibited/Suppressed as this is a Task-Focused Navigation screen -->
<!-- Global Icon Mapping for Compliance -->
<script>
        // Ensure all spans with material-symbols-outlined have the correct inner text from data-icon
        document.querySelectorAll('.material-symbols-outlined').forEach(span => {
            if (span.dataset.icon) {
                span.innerText = span.dataset.icon;
            }
        });
    </script>
</body></html>
