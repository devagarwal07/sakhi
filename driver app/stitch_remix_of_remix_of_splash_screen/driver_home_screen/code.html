<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#d2bbff",
                        "on-secondary-fixed-variant": "#4f319c",
                        "surface-variant": "#e5e0ef",
                        "surface-container-high": "#ebe6f5",
                        "primary": "#630ed4",
                        "on-tertiary-fixed-variant": "#713700",
                        "on-primary-fixed-variant": "#5a00c6",
                        "on-secondary-container": "#3f1e8c",
                        "surface": "#fcf8ff",
                        "on-surface": "#1c1a25",
                        "tertiary-container": "#a15100",
                        "secondary-container": "#ab8ffe",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#ede0ff",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#4a4455",
                        "error": "#ba1a1a",
                        "surface-container": "#f0ecfa",
                        "secondary-fixed-dim": "#cebdff",
                        "primary-fixed": "#eaddff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#d2bbff",
                        "primary-container": "#7c3aed",
                        "surface-container-low": "#f6f1ff",
                        "inverse-surface": "#312f3a",
                        "surface-bright": "#fcf8ff",
                        "surface-tint": "#732ee4",
                        "surface-dim": "#dcd8e6",
                        "secondary": "#674bb5",
                        "tertiary-fixed": "#ffdcc6",
                        "outline": "#7b7487",
                        "on-background": "#1c1a25",
                        "tertiary": "#7d3d00",
                        "on-secondary-fixed": "#21005e",
                        "background": "#fcf8ff",
                        "on-error": "#ffffff",
                        "outline-variant": "#ccc3d8",
                        "on-tertiary-fixed": "#301400",
                        "surface-container-highest": "#e5e0ef",
                        "on-primary-fixed": "#25005a",
                        "secondary-fixed": "#e8ddff",
                        "tertiary-fixed-dim": "#ffb784",
                        "inverse-on-surface": "#f3eefd",
                        "on-tertiary-container": "#ffe0cd",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F0FF;
        }
        .map-gradient {
            background: linear-gradient(180deg, rgba(245, 240, 255, 0) 0%, rgba(245, 240, 255, 0.4) 100%);
        }
        .soft-lavender-shadow {
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen">
<!-- Mobile Container (390x844px) -->
<div class="relative w-[390px] h-[844px] bg-background overflow-hidden shadow-2xl flex flex-col">
<!-- Map Section (Top 55%) -->
<div class="relative h-[55%] w-full">
<!-- Map Placeholder -->
<div class="absolute inset-0 bg-[#E8E1F5]" data-location="New Delhi" style="">
<img class="w-full h-full object-cover opacity-60 mix-blend-multiply grayscale" data-alt="Pastel lavender stylized city map background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKR6mfE5XRrMbG_BDC88O6Pwzfgq8OV4Pf04_eMxaQE3P50VNYQhE2YyVCwEhxjjqo9D7lFArCv5ytKqF0U57alEmTSThQvujPAiiQVbAEHy2wfZm3qS_jQGcsaaklwVAou1DvIsa1_1e-aUF2hg2QvuNToLxDKySEY2WtqVHlQFEHexDF2diitXgy7hZsXg9bO1f8JUR-RB47hZg-m4hAMPPzudOQzOWE6G7zXWe2LNUYMEvH2p-MzGZOrBdE3iI13Qr39yPJ2H_0"/>
<div class="absolute inset-0 map-gradient"></div>
</div>
<!-- Custom Navigation UI (Shared Component Mapping: TopAppBar) -->
<div class="absolute top-0 left-0 w-full p-6 flex justify-between items-start z-10">
<!-- Hamburger Menu -->
<button class="w-12 h-12 bg-surface-container-lowest rounded-full flex items-center justify-center soft-lavender-shadow active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary-container text-2xl" data-icon="menu">menu</span>
</button>
<!-- Earnings Chip -->
<div class="bg-surface-container-lowest px-4 py-2 rounded-2xl flex items-center gap-2 soft-lavender-shadow">
<span class="text-on-surface-variant font-medium text-xs tracking-tight">Today:</span>
<span class="text-primary font-bold text-sm tracking-tight">₹340</span>
</div>
</div>
<!-- Driver Icon Center Position -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<!-- Glow Pulse Effect (Hidden in Offline state but structure remains) -->
<div class="absolute w-24 h-24 bg-primary/10 rounded-full animate-pulse blur-xl"></div>
<div class="relative z-10 w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg border-2 border-primary/20">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="electric_rickshaw">electric_rickshaw</span>
</div>
<div class="mt-2 px-3 py-1 bg-primary text-white text-[10px] font-bold rounded-full uppercase tracking-widest shadow-md">
                    You
                </div>
</div>
</div>
<!-- Bottom Sheet (45% Height) -->
<div class="h-[45%] w-full bg-surface-container-lowest rounded-t-[32px] soft-lavender-shadow flex flex-col px-6 pt-8 pb-10 z-20 relative">
<!-- Handle -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 w-12 h-1 bg-surface-variant rounded-full"></div>
<!-- Status Toggle Section (Offline State) -->
<div class="flex flex-col items-center gap-4 mb-8">
<div class="w-full max-w-[280px] h-16 bg-surface-container-low rounded-full p-1.5 flex items-center relative overflow-hidden">
<!-- Toggle Thumb (Left for Offline) -->
<div class="absolute left-1.5 w-[50%] h-[calc(100%-12px)] bg-outline-variant/20 rounded-full flex items-center justify-center transition-all duration-300">
<span class="text-on-surface-variant font-bold text-sm">OFFLINE</span>
</div>
<!-- Right Side Label -->
<div class="ml-auto mr-8">
<span class="text-on-surface-variant/40 font-bold text-sm">ONLINE</span>
</div>
</div>
<div class="text-center">
<h2 class="text-on-surface font-headline font-bold text-xl tracking-tight">You are Offline</h2>
<p class="text-on-surface-variant text-sm mt-1">Go online to receive rides</p>
</div>
</div>
<!-- Stats Row -->
<div class="grid grid-cols-3 gap-3 mb-6">
<div class="bg-surface-container-low rounded-2xl p-3 flex flex-col items-center justify-center transition-colors hover:bg-surface-container-high cursor-default">
<span class="text-primary font-black text-lg tracking-tight">₹340</span>
<span class="text-on-surface-variant font-label text-[10px] uppercase tracking-wider font-bold mt-1">Today</span>
</div>
<div class="bg-surface-container-low rounded-2xl p-3 flex flex-col items-center justify-center">
<span class="text-primary font-black text-lg tracking-tight">5</span>
<span class="text-on-surface-variant font-label text-[10px] uppercase tracking-wider font-bold mt-1">Trips</span>
</div>
<div class="bg-surface-container-low rounded-2xl p-3 flex flex-col items-center justify-center">
<div class="flex items-center gap-0.5">
<span class="text-primary font-black text-lg tracking-tight">4.9</span>
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<span class="text-on-surface-variant font-label text-[10px] uppercase tracking-wider font-bold mt-1">Rating</span>
</div>
</div>
<!-- Subscription Banner (Locked State) -->
<div class="bg-[#F5F0FF] rounded-2xl px-4 py-3 flex items-center gap-3 border border-primary/5">
<span class="material-symbols-outlined text-tertiary text-xl" data-icon="lock_clock">lock_clock</span>
<div class="flex flex-col">
<span class="text-tertiary font-bold text-xs tracking-tight">Subscription Ride in 25 mins</span>
<span class="text-on-surface-variant/70 text-[10px]">New requests paused until completion</span>
</div>
<span class="ml-auto text-tertiary font-black text-xs">25:00</span>
</div>
</div>
<!-- Bottom Navigation Bar (Shared Component Mapping) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-surface-container-lowest/90 backdrop-blur-lg rounded-t-[32px]">
<!-- Tab: Drive (Active) -->
<div class="flex flex-col items-center justify-center text-primary bg-surface-container-low rounded-2xl px-6 py-2 transition-transform active:scale-95">
<span class="material-symbols-outlined text-2xl" data-icon="explore" style="font-variation-settings: 'FILL' 1;">explore</span>
<span class="font-label text-[10px] uppercase tracking-widest font-bold mt-1">Drive</span>
</div>
<!-- Tab: Earnings -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label text-[10px] uppercase tracking-widest font-bold mt-1">Earnings</span>
</div>
<!-- Tab: Ratings -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="star">star</span>
<span class="font-label text-[10px] uppercase tracking-widest font-bold mt-1">Ratings</span>
</div>
<!-- Tab: Account -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="person">person</span>
<span class="font-label text-[10px] uppercase tracking-widest font-bold mt-1">Account</span>
</div>
</nav>
</div>
</body></html>
