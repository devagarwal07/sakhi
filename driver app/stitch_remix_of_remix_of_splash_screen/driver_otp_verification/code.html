<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed-dim": "#ffb784",
              "outline-variant": "#ccc3d8",
              "on-primary": "#ffffff",
              "inverse-on-surface": "#f3eefd",
              "secondary-fixed": "#e8ddff",
              "on-surface": "#1c1a25",
              "outline": "#7b7487",
              "primary-container": "#7c3aed",
              "on-tertiary": "#ffffff",
              "on-surface-variant": "#4a4455",
              "on-primary-fixed": "#25005a",
              "on-background": "#1c1a25",
              "tertiary": "#7d3d00",
              "primary-fixed-dim": "#d2bbff",
              "on-primary-fixed-variant": "#5a00c6",
              "on-error-container": "#93000a",
              "surface-dim": "#dcd8e6",
              "secondary-fixed-dim": "#cebdff",
              "on-secondary-fixed": "#21005e",
              "on-secondary-fixed-variant": "#4f319c",
              "surface-tint": "#732ee4",
              "background": "#fcf8ff",
              "secondary-container": "#ab8ffe",
              "on-error": "#ffffff",
              "on-secondary-container": "#3f1e8c",
              "on-tertiary-fixed": "#301400",
              "secondary": "#674bb5",
              "surface-bright": "#fcf8ff",
              "surface-container": "#f0ecfa",
              "primary": "#630ed4",
              "inverse-surface": "#312f3a",
              "inverse-primary": "#d2bbff",
              "surface-container-low": "#f6f1ff",
              "on-tertiary-fixed-variant": "#713700",
              "primary-fixed": "#eaddff",
              "error-container": "#ffdad6",
              "on-secondary": "#ffffff",
              "surface": "#fcf8ff",
              "surface-container-high": "#ebe6f5",
              "surface-container-lowest": "#ffffff",
              "error": "#ba1a1a",
              "on-tertiary-container": "#ffe0cd",
              "on-primary-container": "#ede0ff",
              "tertiary-fixed": "#ffdcc6",
              "surface-container-highest": "#e5e0ef",
              "tertiary-container": "#a15100",
              "surface-variant": "#e5e0ef"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #fcf8ff; }
        .otp-shadow { box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08); }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen">
<!-- Mobile Screen Wrapper (390x844) -->
<div class="relative w-[390px] h-[844px] bg-surface overflow-hidden flex flex-col">
<!-- Shared Component: TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#F5F0FF]/80 dark:bg-slate-950/80 backdrop-blur-xl flex items-center px-6 h-16 w-full">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#7C3AED]/10 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[#7C3AED] dark:text-[#A78BFA]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-semibold tracking-tight text-lg flex-1 text-center pr-10 text-[#1E1B2E] dark:text-[#F5F0FF]">Verification</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-8 pt-28 pb-10 flex flex-col items-center">
<!-- Branding/Identity -->
<div class="mb-10 text-center">
<h2 class="text-2xl font-extrabold text-on-background tracking-tight mb-3">Verify Your Number</h2>
<div class="flex flex-col items-center gap-2">
<p class="text-on-surface-variant text-sm text-center leading-relaxed">
                        6-digit SMS code sent to <br/>
<span class="font-semibold text-on-surface">+91 98765 43210</span>
</p>
<div class="flex items-center gap-1.5 py-1 px-3 rounded-full bg-surface-container-low border border-outline-variant/20">
<span class="material-symbols-outlined text-xs text-outline" data-icon="sms">sms</span>
<span class="text-[10px] uppercase tracking-wider font-bold text-outline">Sent via SMS</span>
</div>
</div>
</div>
<!-- OTP Input Grid -->
<div class="grid grid-cols-6 gap-2.5 w-full mb-6">
<!-- Active Box -->
<div class="h-14 bg-surface-container-lowest rounded-xl border-2 border-primary-container otp-shadow flex items-center justify-center relative overflow-hidden ring-4 ring-primary-container/10">
<span class="text-xl font-bold text-on-background">4</span>
<div class="absolute bottom-2 w-4 h-0.5 bg-primary-container animate-pulse"></div>
</div>
<!-- Pre-filled/Inactive Boxes -->
<div class="h-14 bg-surface-container-lowest rounded-xl border border-secondary-container/40 otp-shadow flex items-center justify-center">
<span class="text-xl font-bold text-on-background opacity-20">•</span>
</div>
<div class="h-14 bg-surface-container-lowest rounded-xl border border-secondary-container/40 otp-shadow flex items-center justify-center">
<span class="text-xl font-bold text-on-background opacity-20">•</span>
</div>
<div class="h-14 bg-surface-container-lowest rounded-xl border border-secondary-container/40 otp-shadow flex items-center justify-center">
<span class="text-xl font-bold text-on-background opacity-20">•</span>
</div>
<div class="h-14 bg-surface-container-lowest rounded-xl border border-secondary-container/40 otp-shadow flex items-center justify-center">
<span class="text-xl font-bold text-on-background opacity-20">•</span>
</div>
<div class="h-14 bg-surface-container-lowest rounded-xl border border-secondary-container/40 otp-shadow flex items-center justify-center">
<span class="text-xl font-bold text-on-background opacity-20">•</span>
</div>
</div>
<!-- Timer/Resend Metadata -->
<div class="flex flex-col items-center gap-6">
<p class="text-sm font-medium text-outline">
                    Resend OTP in <span class="text-primary font-bold">0:28</span>
</p>
<!-- Keypad Visual Aid (Contextual UX) -->
<div class="grid grid-cols-3 gap-x-12 gap-y-4 pt-12 opacity-80">
<div class="text-xl font-semibold text-on-surface text-center">1</div>
<div class="text-xl font-semibold text-on-surface text-center">2</div>
<div class="text-xl font-semibold text-on-surface text-center">3</div>
<div class="text-xl font-semibold text-on-surface text-center">4</div>
<div class="text-xl font-semibold text-on-surface text-center">5</div>
<div class="text-xl font-semibold text-on-surface text-center">6</div>
<div class="text-xl font-semibold text-on-surface text-center">7</div>
<div class="text-xl font-semibold text-on-surface text-center">8</div>
<div class="text-xl font-semibold text-on-surface text-center">9</div>
<div></div>
<div class="text-xl font-semibold text-on-surface text-center">0</div>
<div class="flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="backspace">backspace</span>
</div>
</div>
</div>
<!-- Fixed Bottom Action Container -->
<div class="mt-auto w-full pb-10">
<button class="w-full h-14 bg-gradient-to-br from-[#7C3AED] to-[#630ed4] text-white rounded-xl font-bold text-base shadow-[0_16px_32px_rgba(124,58,237,0.2)] active:scale-95 transition-all duration-200">
                    Verify &amp; Continue
                </button>
<p class="mt-4 text-[11px] text-center text-outline px-4 leading-relaxed">
                    By continuing, you confirm that you are the authorized driver of the registered vehicle.
                </p>
</div>
</main>
<!-- Aesthetic Floating Layer -->
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute -top-24 -right-24 w-64 h-64 bg-secondary/10 rounded-full blur-[80px] pointer-events-none"></div>
</div>
</body></html>
