<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sakhi - Driver Verification</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-error": "#ffffff",
              "on-surface-variant": "#4a4455",
              "outline-variant": "#ccc3d8",
              "on-surface": "#1c1a25",
              "primary": "#630ed4",
              "on-secondary-container": "#3f1e8c",
              "surface-container": "#f0ecfa",
              "secondary-fixed": "#e8ddff",
              "tertiary-fixed": "#ffdcc6",
              "surface-container-lowest": "#ffffff",
              "on-background": "#1c1a25",
              "surface-variant": "#e5e0ef",
              "on-secondary-fixed": "#21005e",
              "error": "#ba1a1a",
              "on-primary-fixed": "#25005a",
              "on-primary-fixed-variant": "#5a00c6",
              "on-primary": "#ffffff",
              "on-primary-container": "#ede0ff",
              "inverse-on-surface": "#f3eefd",
              "tertiary": "#7d3d00",
              "secondary-fixed-dim": "#cebdff",
              "tertiary-fixed-dim": "#ffb784",
              "surface-dim": "#dcd8e6",
              "surface-container-high": "#ebe6f5",
              "surface-bright": "#fcf8ff",
              "outline": "#7b7487",
              "on-tertiary-container": "#ffe0cd",
              "on-tertiary": "#ffffff",
              "inverse-primary": "#d2bbff",
              "error-container": "#ffdad6",
              "secondary-container": "#ab8ffe",
              "on-secondary": "#ffffff",
              "tertiary-container": "#a15100",
              "inverse-surface": "#312f3a",
              "background": "#fcf8ff",
              "surface-container-highest": "#e5e0ef",
              "secondary": "#674bb5",
              "primary-fixed-dim": "#d2bbff",
              "surface-container-low": "#f6f1ff",
              "surface": "#fcf8ff",
              "surface-tint": "#732ee4",
              "on-tertiary-fixed": "#301400",
              "primary-container": "#7c3aed",
              "on-tertiary-fixed-variant": "#713700",
              "primary-fixed": "#eaddff",
              "on-secondary-fixed-variant": "#4f319c",
              "on-error-container": "#93000a"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .soft-lavender-shadow {
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
        }
        .spinning-ring {
            border: 4px solid #F5F0FF;
            border-top: 4px solid #7C3AED;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F5F0FF] text-on-background font-body flex items-center justify-center min-h-screen">
<!-- Mobile Screen Wrapper (390x844 approx simulated by container) -->
<main class="w-full max-w-[390px] h-[844px] bg-[#F5F0FF] relative flex flex-col items-center justify-between py-16 px-8 overflow-hidden">
<!-- Top Spacer for Asymmetry -->
<div class="h-12"></div>
<!-- Verification Core Section -->
<div class="flex flex-col items-center text-center w-full">
<!-- Spinner and Shield -->
<div class="relative flex items-center justify-center mb-10">
<div class="spinning-ring"></div>
<div class="absolute flex items-center justify-center bg-white rounded-full p-6 soft-lavender-shadow">
<span class="material-symbols-outlined text-primary-container text-5xl" data-icon="shield_person" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
</div>
<!-- Headline -->
<h1 class="text-[#1E1B2E] font-headline text-2xl font-extrabold tracking-tight mb-3">
                Verifying Your Documents…
            </h1>
<!-- Subtext -->
<p class="text-[#6B7280] font-body text-sm leading-relaxed max-w-[240px]">
                Auto-checking your documents. This takes a few seconds.
            </p>
</div>
<!-- Quote Card Section -->
<div class="w-full flex flex-col items-center">
<!-- Glass/White Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-8 soft-lavender-shadow border border-white/50 relative overflow-hidden min-h-[160px] flex items-center justify-center">
<!-- Asymmetric Decorative Element -->
<div class="absolute -top-4 -right-4 w-12 h-12 bg-primary/5 rounded-full"></div>
<!-- Quote Text (Static placeholder for the active quote) -->
<p class="text-on-background font-medium text-center leading-relaxed italic">
                    "Every great driver starts with a single journey."
                </p>
</div>
<!-- Pagination Dots -->
<div class="flex gap-2 mt-6">
<span class="w-6 h-1.5 bg-primary-container rounded-full"></span>
<span class="w-1.5 h-1.5 bg-outline-variant rounded-full"></span>
<span class="w-1.5 h-1.5 bg-outline-variant rounded-full"></span>
<span class="w-1.5 h-1.5 bg-outline-variant rounded-full"></span>
</div>
</div>
<!-- Bottom Warning/Info -->
<div class="flex items-center gap-2 text-[#6B7280] font-label font-medium tracking-wide">
<span class="material-symbols-outlined text-lg" data-icon="lock">lock</span>
<span class="text-xs">Do not close the app</span>
</div>
<!-- Background Editorial Glows -->
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -top-12 -right-12 w-48 h-48 bg-secondary/5 rounded-full blur-3xl pointer-events-none"></div>
</main>
</body></html>
