<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Methods - Sakhi</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        darkMode: "class",

              "primary-container": "#7c3aed",
              "on-tertiary-container": "#ffe0cd",
              "on-surface-variant": "#4a4455",
              "surface-variant": "#e5e0ef",
              "inverse-primary": "#d2bbff",
              "primary-fixed": "#eaddff",
              "surface-bright": "#fcf8ff",
              "on-secondary-fixed-variant": "#4f319c",
              "error": "#ba1a1a",
              "secondary-container": "#ab8ffe",
              "inverse-on-surface": "#f3eefd",
              "tertiary-container": "#a15100",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "on-primary-fixed": "#25005a",
              "surface-container-highest": "#e5e0ef",

              "on-tertiary": "#ffffff",
              "inverse-surface": "#312f3a",

              "outline-variant": "#ccc3d8",
              "on-secondary": "#ffffff",
              "on-primary": "#ffffff"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }

<style>
        body {
            background-color: #F5F0FF;
            font-family: 'Inter', sans-serif;
            color: #1E1B2E;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 16px 32px rgba(124,58,237,0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex justify-center min-h-screen">
<!-- Mobile Container (390px simulated) -->
<main class="w-full max-w-[390px] bg-[#F5F0FF] relative flex flex-col min-h-screen">
<!-- TopAppBar (Shared Component Execution) -->
<header class="sticky top-0 z-50 bg-[#F6F1FF]/80 backdrop-blur-lg shadow-sm shadow-violet-100/20 flex items-center px-6 h-16 w-full">
<div class="flex items-center gap-4 w-full h-full">
<button class="active:scale-95 transition-transform ease-out text-[#7C3AED] hover:bg-white/50 p-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-inter text-[#1E1B2E] font-semibold tracking-tight text-lg">Payment Methods</h1>
</div>
</header>
<!-- Content Canvas -->
<div class="px-6 py-6 space-y-8 flex-1">
<!-- Banner: Info -->
<section class="bg-[#EDE9FE] rounded-xl p-4 flex items-start gap-3">
<span class="material-symbols-outlined text-primary mt-0.5" style="font-size: 20px;">info</span>
<p class="text-on-surface-variant text-sm leading-relaxed">
                    Sakhi accepts Cash and UPI payments.
                </p>
</section>
<!-- Section: Saved UPI IDs -->
<section class="space-y-4">
<h2 class="text-xs font-bold uppercase tracking-widest text-outline">Saved UPI IDs</h2>
<!-- UPI Card -->
<div class="bg-surface-container-lowest editorial-shadow rounded-xl p-4 flex items-center justify-between transition-all hover:-translate-y-0.5">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary">
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
<div class="flex flex-col">
<div class="flex items-center gap-2">
<span class="font-bold text-on-surface">priya@okaxis</span>
<span class="bg-[#D1FAE5] text-[#065F46] text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-tighter">Primary</span>
</div>
</div>
</div>
<div class="flex gap-2">
<button class="text-outline hover:text-primary transition-colors p-1">
<span class="material-symbols-outlined" style="font-size: 20px;">edit</span>
</button>
<button class="text-outline hover:text-error transition-colors p-1">
<span class="material-symbols-outlined" style="font-size: 20px;">delete</span>
</button>
</div>
</div>
<!-- Add UPI Action -->
<button class="w-full border-2 border-dashed border-outline-variant/30 rounded-xl p-4 flex items-center justify-center gap-2 text-primary font-semibold hover:bg-white/50 transition-all">
<span class="material-symbols-outlined">add_circle</span>
<span>+ Add UPI ID</span>
</button>
</section>
<!-- Section: Cash -->
<section class="space-y-4">
<h2 class="text-xs font-bold uppercase tracking-widest text-outline">Cash</h2>
<div class="bg-surface-container-lowest editorial-shadow rounded-xl p-4 flex items-center justify-between transition-all hover:-translate-y-0.5 border-2 border-primary/10">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center text-emerald-600">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<div class="flex flex-col">
<span class="font-bold text-on-surface">Cash — Pay Driver Directly</span>
<span class="text-xs text-outline">Default for on-demand rides</span>
</div>
</div>
<span class="material-symbols-outlined text-primary">check_circle</span>
</div>
</section>
<!-- Transaction History Link -->
<button class="w-full bg-surface-container-low/50 rounded-xl p-4 flex items-center justify-between group hover:bg-white transition-all">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline">history</span>
<span class="font-semibold text-on-surface">Transaction History</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
<!-- Footer: Security -->
<footer class="mt-auto p-8 flex flex-col items-center gap-2">
<div class="flex items-center gap-2 text-outline">
<span class="material-symbols-outlined" style="font-size: 16px;">lock</span>
<p class="text-[11px] font-medium uppercase tracking-wider text-center">
                    All transactions secured by 256-bit encryption
                </p>
</div>
<!-- Extra breathability for the bottom of the screen -->
<div class="h-4"></div>
</footer>
</main>
</body></html>
