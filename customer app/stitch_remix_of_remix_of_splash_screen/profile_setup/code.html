<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sakhi - Set Up Your Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-on-surface": "#f3eefd",
              "tertiary-container": "#a15100",
              "on-error-container": "#93000a",
              "outline-variant": "#ccc3d8",
              "secondary-container": "#ab8ffe",
              "secondary": "#674bb5",
              "primary-fixed": "#eaddff",
              "surface-variant": "#e5e0ef",
              "secondary-fixed": "#e8ddff",
              "inverse-surface": "#312f3a",
              "surface": "#fcf8ff",
              "primary-fixed-dim": "#d2bbff",
              "on-primary-fixed-variant": "#5a00c6",
              "inverse-primary": "#d2bbff",
              "on-error": "#ffffff",
              "tertiary-fixed": "#ffdcc6",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed": "#25005a",
              "surface-tint": "#732ee4",
              "primary-container": "#7c3aed",
              "on-tertiary-fixed": "#301400",
              "on-secondary-container": "#3f1e8c",
              "on-primary-container": "#ede0ff",
              "on-secondary-fixed": "#21005e",
              "tertiary-fixed-dim": "#ffb784",
              "surface-bright": "#fcf8ff",
              "primary": "#630ed4",
              "on-primary": "#ffffff",
              "background": "#fcf8ff",
              "surface-container-low": "#f6f1ff",
              "on-background": "#1c1a25",
              "on-tertiary-fixed-variant": "#713700",
              "surface-container": "#f0ecfa",
              "secondary-fixed-dim": "#cebdff",
              "on-secondary": "#ffffff",
              "tertiary": "#7d3d00",
              "on-surface": "#1c1a25",
              "surface-container-high": "#ebe6f5",
              "error-container": "#ffdad6",
              "outline": "#7b7487",
              "on-tertiary-container": "#ffe0cd",
              "on-tertiary": "#ffffff",
              "on-surface-variant": "#4a4455",
              "surface-container-highest": "#e5e0ef",
              "surface-dim": "#dcd8e6",
              "on-secondary-fixed-variant": "#4f319c",
              "error": "#ba1a1a"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F0FF;
            color: #1c1a25;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-lavender-shadow {
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-4">
<!-- Mobile Container Emulator -->
<main class="w-full max-w-[390px] min-h-[844px] bg-[#F5F0FF] relative flex flex-col overflow-hidden shadow-2xl md:rounded-[3rem] md:border-[8px] md:border-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#F5F0FF]/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 w-full shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<button class="w-10 h-10 flex items-center justify-start text-[#7C3AED] active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-semibold tracking-tight text-[#1E1B2E] text-lg">Set Up Your Profile</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Content Canvas -->
<div class="flex-1 mt-16 px-6 pb-10 pt-8 overflow-y-auto">
<!-- Hero Subtext Section -->
<div class="text-center mb-10">
<p class="text-[#6B7280] font-body text-md leading-relaxed">Tell us a bit about yourself</p>
</div>
<!-- Avatar Upload Section -->
<div class="flex justify-center mb-12">
<div class="relative group">
<!-- Avatar Placeholder -->
<div class="w-24 h-24 rounded-full bg-[#EDE9FE] flex items-center justify-center overflow-hidden soft-lavender-shadow">
<span class="material-symbols-outlined text-[#7C3AED] text-5xl" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<!-- Camera Action Button -->
<button class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-lg border border-surface-container-low active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[#7C3AED] text-lg" data-icon="photo_camera">photo_camera</span>
</button>
</div>
</div>
<!-- Profile Form -->
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="block text-[0.75rem] font-medium text-[#6B7280] uppercase tracking-wider pl-1">Full Name</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#7C3AED]/60 group-focus-within:text-[#7C3AED] transition-colors" data-icon="person">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-white border-0 rounded-xl soft-lavender-shadow focus:ring-2 focus:ring-[#7C3AED] placeholder-[#6B7280]/40 text-[#1E1B2E] transition-all" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="block text-[0.75rem] font-medium text-[#6B7280] uppercase tracking-wider pl-1">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#7C3AED]/60 group-focus-within:text-[#7C3AED] transition-colors" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-white border-0 rounded-xl soft-lavender-shadow focus:ring-2 focus:ring-[#7C3AED] placeholder-[#6B7280]/40 text-[#1E1B2E] transition-all" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Phone Number (Non-editable) -->
<div class="space-y-2">
<label class="block text-[0.75rem] font-medium text-[#6B7280] uppercase tracking-wider pl-1">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#6B7280]/40" data-icon="call">call</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-low/50 border-0 rounded-xl text-[#6B7280] cursor-not-allowed opacity-80" readonly="" type="text" value="+1 (555) 000-0000"/>
</div>
</div>
<!-- Home Address -->
<div class="space-y-2">
<label class="block text-[0.75rem] font-medium text-[#6B7280] uppercase tracking-wider pl-1">Home Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-white border-0 rounded-xl soft-lavender-shadow focus:ring-2 focus:ring-[#7C3AED] placeholder-[#6B7280]/40 text-[#1E1B2E] transition-all" placeholder="Add your location" type="text"/>
</div>
</div>
<!-- Action Button -->
<div class="pt-6">
<button class="w-full py-4 px-6 bg-gradient-to-br from-[#7C3AED] to-[#630ed4] text-white font-semibold rounded-xl soft-lavender-shadow active:scale-[0.98] hover:translate-y-[-2px] transition-all duration-200 shadow-lg" type="button">
                        Save &amp; Continue
                    </button>
</div>
</form>
</div>
<!-- Decorative Subtle Bloom -->
<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute -top-20 -right-20 w-64 h-64 bg-secondary/5 rounded-full blur-[80px] pointer-events-none"></div>
</main>
</body></html>
