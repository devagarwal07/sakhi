<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f6f1ff",
              "on-tertiary-fixed": "#301400",
              "background": "#fcf8ff",
              "surface-dim": "#dcd8e6",
              "on-secondary-container": "#3f1e8c",
              "primary-fixed": "#eaddff",
              "tertiary-fixed": "#ffdcc6",
              "outline-variant": "#ccc3d8",
              "on-tertiary-container": "#ffe0cd",
              "on-primary": "#ffffff",
              "on-secondary": "#ffffff",
              "inverse-primary": "#d2bbff",
              "surface-container-high": "#ebe6f5",
              "surface": "#fcf8ff",
              "primary-fixed-dim": "#d2bbff",
              "surface-container": "#f0ecfa",
              "tertiary-container": "#a15100",
              "tertiary": "#7d3d00",
              "on-tertiary-fixed-variant": "#713700",
              "on-tertiary": "#ffffff",
              "tertiary-fixed-dim": "#ffb784",
              "secondary-container": "#ab8ffe",
              "error-container": "#ffdad6",
              "on-secondary-fixed-variant": "#4f319c",
              "error": "#ba1a1a",
              "inverse-surface": "#312f3a",
              "secondary-fixed-dim": "#cebdff",
              "secondary": "#674bb5",
              "surface-bright": "#fcf8ff",
              "outline": "#7b7487",
              "on-background": "#1c1a25",
              "surface-tint": "#732ee4",
              "surface-variant": "#e5e0ef",
              "inverse-on-surface": "#f3eefd",
              "on-secondary-fixed": "#21005e",
              "secondary-fixed": "#e8ddff",
              "primary": "#630ed4",
              "surface-container-highest": "#e5e0ef",
              "primary-container": "#7c3aed",
              "on-primary-fixed-variant": "#5a00c6",
              "on-error": "#ffffff",
              "on-surface-variant": "#4a4455",
              "on-surface": "#1c1a25",
              "on-primary-fixed": "#25005a",
              "on-error-container": "#93000a",
              "on-primary-container": "#ede0ff"
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-lavender-shadow {
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
        }
        .glow-check {
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F5F0FF] text-on-background font-body min-h-screen flex flex-col items-center">
<!-- Top Navigation Shell (Hidden for focused journey as per rule) -->
<header class="fixed top-0 w-full z-50 bg-[#F5F0FF]/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 w-full shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#7C3AED] cursor-pointer scale-95 active:scale-90 duration-200">arrow_back</span>
<h1 class="font-headline font-semibold tracking-tight text-lg text-[#1E1B2E]">Account Status</h1>
</div>
</header>
<main class="w-full max-w-[390px] pt-24 pb-32 px-6 flex flex-col items-center text-center">
<!-- Animated Success State -->
<div class="mb-8 relative">
<div class="w-24 h-24 rounded-full bg-white flex items-center justify-center glow-check relative z-10">
<span class="material-symbols-outlined text-green-500 text-6xl" style="font-variation-settings: 'wght' 600;">check_circle</span>
</div>
<!-- Decorative soft circles -->
<div class="absolute inset-0 bg-green-100 rounded-full blur-2xl opacity-40 -z-10 animate-pulse"></div>
</div>
<!-- Headline Section -->
<div class="space-y-2 mb-10">
<h2 class="text-3xl font-extrabold tracking-tight text-[#1E1B2E]">You're Approved! 🎉</h2>
<p class="text-[#6B7280] leading-relaxed">Your Sakhi driver account is active and ready.</p>
</div>
<!-- Summary Card -->
<div class="w-full bg-white rounded-2xl p-6 soft-lavender-shadow text-left space-y-6 mb-6">
<div class="flex justify-between items-start">
<div>
<label class="text-[10px] uppercase tracking-widest font-bold text-[#6B7280] block mb-1">Driver Name</label>
<p class="text-[#1E1B2E] font-semibold text-lg">Priya Sharma</p>
</div>
<div class="bg-[#F5F0FF] p-2 rounded-xl">
<span class="material-symbols-outlined text-[#7C3AED]">person_check</span>
</div>
</div>
<div class="grid grid-cols-1 gap-4">
<div class="p-4 bg-[#fcf8ff] rounded-xl">
<label class="text-[10px] uppercase tracking-widest font-bold text-[#6B7280] block mb-1">Vehicle Details</label>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#7C3AED] text-sm">electric_rickshaw</span>
<p class="text-[#1E1B2E] font-medium">Auto KA 05 AB 1234</p>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1">
<label class="text-[10px] uppercase tracking-widest font-bold text-[#6B7280]">KYC Status</label>
<div class="flex items-center gap-1 text-green-600 font-bold text-sm">
                            Verified <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
<div class="space-y-1 text-right">
<label class="text-[10px] uppercase tracking-widest font-bold text-[#6B7280]">Account</label>
<div class="flex items-center justify-end gap-1 text-green-600 font-bold text-sm">
                            Active <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
</div>
</div>
</div>
<!-- Welcome Banner -->
<div class="w-full py-4 px-2 italic text-[#6B7280] text-sm leading-relaxed">
            "Welcome to the Sakhi family. Your first ride awaits! 💜"
        </div>
</main>
<!-- Bottom Action Shell -->
<footer class="fixed bottom-0 left-0 w-full p-6 bg-white/80 backdrop-blur-lg rounded-t-[32px] shadow-[0_-16px_32px_rgba(124,58,237,0.08)]">
<button class="w-full bg-gradient-to-br from-[#7C3AED] to-[#630ED4] text-white py-4 rounded-xl font-bold text-lg shadow-[0_12px_24px_rgba(124,58,237,0.3)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
            Continue to Dashboard
        </button>
</footer>
</body></html>
