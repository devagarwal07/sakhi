<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vehicle Details - Sakhi Driver App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#674bb5",
                        "primary-fixed": "#eaddff",
                        "on-surface": "#1c1a25",
                        "surface-container-low": "#f6f1ff",
                        "surface-bright": "#fcf8ff",
                        "primary-fixed-dim": "#d2bbff",
                        "surface-variant": "#e5e0ef",
                        "on-primary": "#ffffff",
                        "on-background": "#1c1a25",
                        "outline": "#7b7487",
                        "on-primary-fixed": "#25005a",
                        "on-primary-container": "#ede0ff",
                        "surface-dim": "#dcd8e6",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f3eefd",
                        "background": "#fcf8ff",
                        "primary-container": "#7c3aed",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffdcc6",
                        "primary": "#630ed4",
                        "on-secondary-fixed-variant": "#4f319c",
                        "secondary-fixed-dim": "#cebdff",
                        "secondary-fixed": "#e8ddff",
                        "surface": "#fcf8ff",
                        "inverse-primary": "#d2bbff",
                        "tertiary": "#7d3d00",
                        "on-tertiary-container": "#ffe0cd",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#301400",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#a15100",
                        "on-surface-variant": "#4a4455",
                        "on-secondary-fixed": "#21005e",
                        "surface-tint": "#732ee4",
                        "outline-variant": "#ccc3d8",
                        "on-tertiary-fixed-variant": "#713700",
                        "on-primary-fixed-variant": "#5a00c6",
                        "surface-container-highest": "#e5e0ef",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb784",
                        "surface-container-high": "#ebe6f5",
                        "surface-container": "#f0ecfa",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#3f1e8c",
                        "inverse-surface": "#312f3a",
                        "secondary-container": "#ab8ffe",
                        "on-tertiary": "#ffffff"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F0FF;
            color: #1E1B2E;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-shadow {
            box-shadow: 0 16px 32px rgba(124,58,237,0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#F5F0FF]/80 backdrop-blur-xl flex justify-between items-center px-6 py-4 custom-shadow">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#7C3AED] cursor-pointer active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</span>
<h1 class="font-semibold tracking-tight text-lg text-[#1E1B2E]">Vehicle Details</h1>
</div>
<span class="text-[#6B7280] text-sm font-medium">Step 4 of 5</span>
</header>
<main class="mt-20 px-6 space-y-8 max-w-md mx-auto">
<!-- Hero Section -->
<section class="pt-4">
<h2 class="text-3xl font-extrabold tracking-tight text-[#1E1B2E]">Your Vehicle Details</h2>
<p class="text-[#6B7280] mt-2 leading-relaxed">Please provide accurate information to complete your registration.</p>
</section>
<!-- Main Input Card -->
<div class="bg-white rounded-[16px] p-6 space-y-6 custom-shadow border border-[#7C3AED]/5">
<!-- Vehicle Type -->
<div class="space-y-2">
<label class="block text-xs font-medium uppercase tracking-widest text-[#6B7280]">Vehicle Type</label>
<div class="relative group">
<select class="w-full bg-[#F5F0FF]/50 border-none rounded-xl px-4 py-3 text-[#1E1B2E] appearance-none focus:ring-2 focus:ring-[#7C3AED] transition-all cursor-pointer">
<option selected="">Auto</option>
<option>E-Rickshaw</option>
<option>Mini Van</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-[#7C3AED] pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Registration Number -->
<div class="space-y-2">
<label class="block text-xs font-medium uppercase tracking-widest text-[#6B7280]">Registration Number</label>
<input class="w-full bg-[#F5F0FF]/50 border-none rounded-xl px-4 py-3 text-[#1E1B2E] focus:ring-2 focus:ring-[#7C3AED] transition-all placeholder:text-[#6B7280]/40" placeholder="KA 05 AB 1234" type="text"/>
</div>
<!-- Vehicle Colour -->
<div class="space-y-3">
<label class="block text-xs font-medium uppercase tracking-widest text-[#6B7280]">Vehicle Colour</label>
<div class="flex items-center gap-4">
<button aria-label="Yellow" class="w-10 h-10 rounded-full bg-yellow-400 border-4 border-white ring-2 ring-[#7C3AED] transition-transform active:scale-90"></button>
<button aria-label="White" class="w-10 h-10 rounded-full bg-white border border-[#E5E0EF] transition-transform active:scale-90"></button>
<button aria-label="Black" class="w-10 h-10 rounded-full bg-black border-2 border-white transition-transform active:scale-90"></button>
<button aria-label="Silver" class="w-10 h-10 rounded-full bg-slate-300 border-2 border-white transition-transform active:scale-90"></button>
</div>
</div>
<!-- Model Name -->
<div class="space-y-2">
<label class="block text-xs font-medium uppercase tracking-widest text-[#6B7280]">Model Name</label>
<input class="w-full bg-[#F5F0FF]/50 border-none rounded-xl px-4 py-3 text-[#1E1B2E] focus:ring-2 focus:ring-[#7C3AED] transition-all placeholder:text-[#6B7280]/40" placeholder="Bajaj RE" type="text"/>
</div>
</div>
<!-- Preview Card -->
<div class="bg-white/60 rounded-[16px] p-4 flex items-center gap-4 border border-white/80">
<div class="w-12 h-12 bg-[#F5F0FF] rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="directions_car">directions_car</span>
</div>
<div>
<p class="text-sm font-bold text-[#1E1B2E]">KA 05 AB 1234 · Yellow</p>
<p class="text-xs text-[#6B7280]">Bajaj RE</p>
</div>
<span class="material-symbols-outlined ml-auto text-[#7C3AED]/50" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-[#F5F0FF]/80 backdrop-blur-xl px-6 pb-8 pt-4 z-40">
<button class="w-full bg-gradient-to-br from-[#7C3AED] to-[#630ED4] text-white font-semibold py-4 rounded-xl custom-shadow active:scale-[0.98] transition-all">
            Save &amp; Continue
        </button>
</div>
<!-- BottomNavBar -->
<nav class="hidden md:flex fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-lg justify-around items-center px-4 pb-6 pt-2 custom-shadow rounded-t-2xl z-50">
<div class="flex flex-col items-center justify-center text-[#6B7280]">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[10px] font-medium uppercase tracking-widest mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7280]">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="text-[10px] font-medium uppercase tracking-widest mt-1">Earnings</span>
</div>
<div class="flex flex-col items-center justify-center bg-[#F5F0FF] text-[#7C3AED] rounded-xl px-4 py-1">
<span class="material-symbols-outlined" data-icon="directions_car">directions_car</span>
<span class="text-[10px] font-medium uppercase tracking-widest mt-1">Vehicles</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7280]">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[10px] font-medium uppercase tracking-widest mt-1">Account</span>
</div>
</nav>
</body></html>
