<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#dcd8e6",
              "surface": "#fcf8ff",
              "on-primary-fixed-variant": "#5a00c6",
              "surface-container-high": "#ebe6f5",
              "surface-bright": "#fcf8ff",
              "outline": "#7b7487",
              "on-secondary": "#ffffff",
              "error-container": "#ffdad6",
              "surface-variant": "#e5e0ef",
              "tertiary-container": "#a15100",
              "tertiary-fixed-dim": "#ffb784",
              "outline-variant": "#ccc3d8",
              "inverse-primary": "#d2bbff",
              "on-tertiary-fixed-variant": "#713700",
              "tertiary-fixed": "#ffdcc6",
              "surface-container-lowest": "#ffffff",
              "secondary-fixed-dim": "#cebdff",
              "on-tertiary-container": "#ffe0cd",
              "on-secondary-fixed-variant": "#4f319c",
              "surface-tint": "#732ee4",
              "on-primary-fixed": "#25005a",
              "inverse-on-surface": "#f3eefd",
              "on-primary": "#ffffff",
              "secondary-fixed": "#e8ddff",
              "surface-container-low": "#f6f1ff",
              "on-tertiary-fixed": "#301400",
              "on-error-container": "#93000a",
              "primary-fixed-dim": "#d2bbff",
              "surface-container": "#f0ecfa",
              "on-surface": "#1c1a25",
              "on-error": "#ffffff",
              "secondary-container": "#ab8ffe",
              "on-secondary-fixed": "#21005e",
              "primary": "#630ed4",
              "tertiary": "#7d3d00",
              "secondary": "#674bb5",
              "inverse-surface": "#312f3a",
              "on-tertiary": "#ffffff",
              "on-surface-variant": "#4a4455",
              "on-primary-container": "#ede0ff",
              "on-background": "#1c1a25",
              "background": "#fcf8ff",
              "error": "#ba1a1a",
              "on-secondary-container": "#3f1e8c",
              "primary-container": "#7c3aed",
              "surface-container-highest": "#e5e0ef",
              "primary-fixed": "#eaddff",
              "emergency-amber": "#92400E"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
        .deplete-progress {
            width: 100%;
            animation: deplete 5s linear forwards;
        }
        @keyframes deplete {
            from { width: 100%; }
            to { width: 0%; }
        }
        .sos-glow {
            box-shadow: 0 0 20px rgba(186, 26, 26, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-emergency-amber h-full flex flex-col font-body selection:bg-white/30 overflow-hidden">
<!-- Pre-SOS Confirmation Screen -->
<main class="flex-1 flex flex-col items-center justify-center px-8 relative">
<!-- Urgent Warning Icon Section -->
<div class="relative mb-12 flex items-center justify-center">
<!-- Animated Expanding Rings -->
<div class="absolute w-48 h-48 bg-white/20 rounded-full pulse-ring"></div>
<div class="absolute w-32 h-32 bg-white/30 rounded-full pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Central Warning Icon -->
<div class="relative bg-white w-24 h-24 rounded-full flex items-center justify-center shadow-2xl">
<span class="material-symbols-outlined text-emergency-amber text-5xl" style="font-variation-settings: 'FILL' 1;">
                    warning
                </span>
</div>
</div>
<!-- Heading & Context -->
<div class="text-center space-y-4 mb-16">
<h1 class="text-white font-headline text-4xl font-extrabold tracking-tight">
                Are you in danger?
            </h1>
<p class="text-white/80 font-body font-light text-lg leading-relaxed max-w-[280px] mx-auto">
                Your emergency contacts and Sakhi team will be notified immediately.
            </p>
</div>
<!-- Action Stack -->
<div class="w-full space-y-4 max-w-sm">
<!-- Primary Action -->
<button class="w-full bg-error text-white font-headline font-bold py-5 px-6 rounded-[16px] sos-glow flex items-center justify-center gap-3 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">emergency_home</span>
                YES — Send SOS Alert
            </button>
<!-- Secondary Action -->
<button class="w-full bg-white text-on-background font-headline font-semibold py-5 px-6 rounded-[16px] flex items-center justify-center active:scale-95 transition-transform duration-200">
                No, I'm Safe — Go Back
            </button>
</div>
<!-- Countdown & Progress -->
<div class="mt-12 w-full max-w-[240px] flex flex-col items-center gap-4">
<div class="bg-white/10 backdrop-blur-md px-5 py-2 rounded-full">
<span class="text-white font-label font-medium tracking-wide">
                    Sending automatically in 5…
                </span>
</div>
<!-- Depleting Progress Bar -->
<div class="w-full h-1.5 bg-white/20 rounded-full overflow-hidden">
<div class="h-full bg-error deplete-progress"></div>
</div>
</div>
</main>
<!-- Urgent Footer -->
<footer class="pb-10 pt-4 text-center">
<p class="text-white/60 text-xs font-label uppercase tracking-[0.1em]">
            SOS will auto-send if no response.
        </p>
</footer>
<!-- Visual Polish: Soft Ambient Light -->
<div class="fixed top-[-10%] left-[-10%] w-[50%] h-[40%] bg-white/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[40%] bg-black/10 blur-[120px] rounded-full pointer-events-none"></div>
</body></html>
