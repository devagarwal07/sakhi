<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed-variant": "#713700",
                        "error": "#ba1a1a",
                        "surface-dim": "#dcd8e6",
                        "tertiary": "#7d3d00",
                        "on-tertiary-fixed": "#301400",
                        "on-secondary-container": "#3f1e8c",
                        "on-error-container": "#93000a",
                        "primary-container": "#7c3aed",
                        "surface-container": "#f0ecfa",
                        "surface-container-high": "#ebe6f5",
                        "on-background": "#1c1a25",
                        "tertiary-fixed-dim": "#ffb784",
                        "on-secondary-fixed": "#21005e",
                        "background": "#fcf8ff",
                        "surface-tint": "#732ee4",
                        "on-tertiary-container": "#ffe0cd",
                        "on-primary-fixed": "#25005a",
                        "primary": "#630ed4",
                        "inverse-on-surface": "#f3eefd",
                        "on-surface": "#1c1a25",
                        "on-primary-fixed-variant": "#5a00c6",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#eaddff",
                        "surface-bright": "#fcf8ff",
                        "secondary": "#674bb5",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#d2bbff",
                        "inverse-surface": "#312f3a",
                        "surface-variant": "#e5e0ef",
                        "outline-variant": "#ccc3d8",
                        "secondary-fixed": "#e8ddff",
                        "on-primary-container": "#ede0ff",
                        "surface-container-low": "#f6f1ff",
                        "on-surface-variant": "#4a4455",
                        "secondary-fixed-dim": "#cebdff",
                        "on-secondary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container-highest": "#e5e0ef",
                        "on-secondary-fixed-variant": "#4f319c",
                        "secondary-container": "#ab8ffe",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffdcc6",
                        "outline": "#7b7487",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#d2bbff",
                        "tertiary-container": "#a15100"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #F5F0FF;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .editorial-shadow {
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
        }
        .glass-header {
            background: rgba(245, 240, 255, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 glass-header editorial-shadow">
<div class="flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full active:scale-95 transition-transform hover:bg-white/50">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-semibold tracking-tight text-on-surface text-lg">Edit Profile</h1>
</div>
<button class="font-label font-bold text-primary px-4 py-2 rounded-full hover:bg-white/50 transition-colors">Save</button>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-[390px] mx-auto min-h-screen">
<!-- Avatar Section -->
<div class="flex flex-col items-center mb-8">
<div class="relative group">
<div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-sm">
<img alt="Profile Picture" class="w-full h-full object-cover" data-alt="Close-up portrait of a smiling woman for profile" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAYyzdE435eiBWsj5MuHvBe2rgEwGfVDuPwggLN1PkB08wVP5jTioY9fENhRhhihDuECHGMCpjHPzdtrdMcksONblc-OT1UXVYaPClUqeq6GMdRteSqL9mjA3C-4ogrzEMM4enYBaiPKqB753wsXQkQYRTZmPYUavcnDL0KvSfJITWk3FKI10h8agexZSIXXtzV324ejy47_ky8BHI9OZhC1NB7G3eVda0sF189ogKC5raP7Og1IArZ0aZZlXZZio5H4-BDdB3MrY8"/>
</div>
<button class="absolute bottom-0 right-0 bg-primary-container p-2 rounded-full text-white shadow-lg active:scale-90 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined text-sm" data-icon="photo_camera" style="font-size: 18px;">photo_camera</span>
</button>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-[16px] p-6 editorial-shadow flex flex-col gap-6">
<!-- Full Name -->
<div class="flex flex-col gap-1.5">
<label class="text-[0.75rem] font-bold uppercase tracking-widest text-outline ml-1">Full Name</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 text-on-surface font-medium transition-all" type="text" value="Priya Sharma"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="text-[0.75rem] font-bold uppercase tracking-widest text-outline ml-1">Email</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 text-on-surface font-medium transition-all" type="email" value="priya.sharma@example.com"/>
</div>
<!-- Phone -->
<div class="flex flex-col gap-1.5">
<label class="text-[0.75rem] font-bold uppercase tracking-widest text-outline ml-1">Phone</label>
<div class="flex items-center justify-between px-4 py-3 rounded-xl bg-surface-container-low">
<span class="text-on-surface font-medium">+91 98765 43210</span>
<button class="text-primary text-sm font-bold hover:opacity-80 transition-opacity">Change Number →</button>
</div>
</div>
<!-- Date of Birth -->
<div class="flex flex-col gap-1.5">
<label class="text-[0.75rem] font-bold uppercase tracking-widest text-outline ml-1">Date of Birth</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 text-on-surface font-medium transition-all" type="text" value="12/05/1995"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Preferred Language -->
<div class="flex flex-col gap-1.5">
<label class="text-[0.75rem] font-bold uppercase tracking-widest text-outline ml-1">Preferred Language</label>
<div class="relative">
<select class="w-full appearance-none px-4 py-3 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 text-on-surface font-medium transition-all">
<option>English</option>
<option>Hindi</option>
<option>Marathi</option>
<option>Tamil</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Verification Status Card -->
<div class="mt-2 p-5 bg-surface-container-low rounded-xl flex flex-col gap-4">
<div class="flex flex-col gap-2">
<div class="flex items-center gap-2 text-emerald-600 font-semibold text-sm">
<span class="material-symbols-outlined text-[18px]" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
<span>Aadhaar Verified</span>
</div>
<div class="flex items-center gap-2 text-emerald-600 font-semibold text-sm">
<span class="material-symbols-outlined text-[18px]" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
<span>Gender Verified</span>
</div>
</div>
<button class="text-primary text-xs font-bold uppercase tracking-wider text-left hover:underline">Re-verify</button>
</div>
</div>
</main>
<!-- Bottom Action -->
<footer class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#F5F0FF] via-[#F5F0FF] to-transparent">
<div class="max-w-[342px] mx-auto">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold py-4 rounded-[12px] shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                Save Changes
            </button>
</div>
</footer>
</body></html>
