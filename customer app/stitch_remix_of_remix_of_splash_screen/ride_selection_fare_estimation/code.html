<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sakhi - Ride Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-on-surface": "#f3eefd",
              "primary": "#630ed4",
              "surface-tint": "#732ee4",
              "on-surface-variant": "#4a4455",
              "background": "#fcf8ff",
              "error": "#ba1a1a",
              "secondary-fixed-dim": "#cebdff",
              "surface-bright": "#fcf8ff",
              "on-secondary-container": "#3f1e8c",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "on-error": "#ffffff",
              "tertiary-fixed": "#ffdcc6",
              "on-secondary-fixed-variant": "#4f319c",
              "surface-container": "#f0ecfa",
              "secondary": "#674bb5",
              "secondary-fixed": "#e8ddff",
              "primary-container": "#7c3aed",
              "on-tertiary-container": "#ffe0cd",
              "on-primary-fixed": "#25005a",
              "surface-variant": "#e5e0ef",
              "on-primary-container": "#ede0ff",
              "secondary-container": "#ab8ffe",
              "tertiary-container": "#a15100",
              "inverse-primary": "#d2bbff",
              "primary-fixed": "#eaddff",
              "on-primary-fixed-variant": "#5a00c6",
              "on-tertiary-fixed-variant": "#713700",
              "primary-fixed-dim": "#d2bbff",
              "surface-container-high": "#ebe6f5",
              "surface": "#fcf8ff",
              "outline": "#7b7487",
              "surface-container-lowest": "#ffffff",
              "on-tertiary-fixed": "#301400",
              "error-container": "#ffdad6",
              "tertiary": "#7d3d00",
              "surface-dim": "#dcd8e6",
              "on-secondary-fixed": "#21005e",
              "on-secondary": "#ffffff",
              "on-tertiary": "#ffffff",
              "outline-variant": "#ccc3d8",
              "inverse-surface": "#312f3a",
              "on-background": "#1c1a25",
              "tertiary-fixed-dim": "#ffb784",
              "on-surface": "#1c1a25",
              "surface-container-low": "#f6f1ff",
              "surface-container-highest": "#e5e0ef"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F0FF; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(245, 240, 255, 0) 70%, #F5F0FF 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background antialiased flex justify-center items-center min-h-screen">
<!-- Mobile Container (390x844px) -->
<main class="w-[390px] h-[844px] bg-[#F5F0FF] relative overflow-hidden shadow-2xl flex flex-col">
<!-- Top Navigation Bar (Shared Component Strategy) -->
<header class="fixed top-0 w-[390px] z-50 bg-[#F5F0FF]/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#F6F1FF] transition-all active:scale-95 duration-200 text-[#7C3AED]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-xl font-black text-[#1E1B2E] font-headline tracking-tight">Sakhi</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#F6F1FF] transition-all active:scale-95 duration-200 text-[#7C3AED]">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Scrollable Content -->
<div class="flex-1 overflow-y-auto pt-20 pb-32">
<!-- Address Pill Card -->
<section class="px-5 mb-6">
<div class="bg-surface-container-lowest rounded-full p-4 shadow-[0_16px_32px_rgba(124,58,237,0.08)] flex items-center gap-3">
<div class="flex flex-col gap-1 items-center">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-0.5 h-4 bg-outline-variant/30"></div>
<div class="w-2 h-2 rounded-full border-2 border-primary"></div>
</div>
<div class="flex-1 overflow-hidden">
<p class="text-[13px] font-semibold text-on-surface truncate">12, Green Park Avenue, New Delhi</p>
<p class="text-[13px] font-medium text-on-surface-variant truncate">Hauz Khas Social, New Delhi</p>
</div>
<button class="p-2 text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
</button>
</div>
</section>
<!-- Map View (28% Height) -->
<section class="w-full h-[236px] relative mb-6">
<div class="absolute inset-0 bg-[#E5E0EF] overflow-hidden">
<!-- Map Mockup -->
<img class="w-full h-full object-cover opacity-60 grayscale-[0.3]" data-alt="Muted pastel map style showing a city route" data-location="New Delhi" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWlvzk0A5uuyTek5x5kNOjEUDMBJexuqfwLU1nXhLhv2oSR4blSMvXUlX_sWI7zLxSYnCeNXk6jFaYo5qUqiw7fsBYm4_yabLlHCSBDeHCo3aNwunvTaYAT4l8Md_j23ua9vMbESZGIgddiWVKqYxulCHEBxxl73SzefotqSA07yX_zg7rFTVcfIwLddsXZoetSFm2AIJShcSbF1f_QJVXDkHpC97C0jqMaRix1qPxnBHRGVISJ72NcOG20WGJDycbaGGZPAsReISq"/>
<!-- Simulated Route Line -->
<svg class="absolute inset-0 w-full h-full" viewbox="0 0 390 236">
<path d="M100 180 Q 150 150 200 100 T 290 50" fill="none" stroke="#7C3AED" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"></path>
<circle cx="100" cy="180" fill="#7C3AED" r="8"></circle>
<circle cx="290" cy="50" fill="white" r="8" stroke="#7C3AED" stroke-width="3"></circle>
</svg>
<div class="absolute inset-0 map-gradient-overlay"></div>
</div>
</section>
<!-- Select Ride Header -->
<section class="px-6 mb-4">
<h2 class="text-[11px] font-bold text-on-surface-variant uppercase tracking-[0.1em] font-label">Select Ride</h2>
</section>
<!-- Ride Selection Card -->
<section class="px-5 mb-4">
<div class="relative bg-[#EDE9FE] border-2 border-[#7C3AED] rounded-[16px] p-4 shadow-[0_16px_32px_rgba(124,58,237,0.08)] flex items-center transition-all">
<!-- Selection Badge -->
<div class="absolute -top-2 -right-2 bg-[#7C3AED] text-white rounded-full p-1 shadow-md">
<span class="material-symbols-outlined text-[16px]" data-icon="check" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<!-- Left: Illustration -->
<div class="w-16 h-16 bg-[#F5F0FF] rounded-xl flex items-center justify-center mr-4">
<span class="material-symbols-outlined text-[#7C3AED] text-4xl" data-icon="electric_rickshaw">electric_rickshaw</span>
</div>
<!-- Center: Info -->
<div class="flex-1">
<div class="flex items-center gap-2">
<span class="font-bold text-[#1E1B2E] text-lg">Auto</span>
<span class="bg-[#7C3AED]/10 text-[#7C3AED] text-[10px] px-2 py-0.5 rounded-full font-bold">FASTER</span>
</div>
<p class="text-on-surface-variant text-sm font-medium">Up to 3 passengers</p>
</div>
<!-- Right: Pricing -->
<div class="text-right">
<p class="font-black text-[#7C3AED] text-lg tracking-tight">₹85 – ₹110</p>
<p class="text-green-600 text-xs font-bold">12 mins away</p>
</div>
</div>
</section>
<!-- Fare Breakdown (Expanded) -->
<section class="px-5 mb-6">
<div class="flex items-center justify-between px-1 mb-3">
<button class="flex items-center gap-2 text-on-surface-variant group">
<span class="text-sm font-bold">Fare Breakdown</span>
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-y-0.5" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</button>
</div>
<!-- Breakdown Content Card -->
<div class="bg-surface-container-lowest rounded-2xl p-5 shadow-[0_16px_32px_rgba(124,58,237,0.08)] space-y-4">
<div class="flex justify-between items-center">
<span class="text-on-surface-variant text-sm font-medium">Base Fare</span>
<span class="text-on-surface text-sm font-semibold">₹30</span>
</div>
<div class="flex justify-between items-center">
<span class="text-on-surface-variant text-sm font-medium">Distance (3.2 km)</span>
<span class="text-on-surface text-sm font-semibold">₹55</span>
</div>
<div class="flex justify-between items-center">
<span class="text-on-surface-variant text-sm font-medium">Waiting (if any)</span>
<span class="text-on-surface text-sm font-semibold">₹0</span>
</div>
<div class="pt-3 border-t border-outline-variant/15 flex justify-between items-center">
<span class="text-on-surface font-bold">Total Estimate</span>
<span class="text-[#7C3AED] font-black text-xl">₹85</span>
</div>
</div>
</section>
<!-- Distance Pill -->
<div class="flex justify-center mb-8">
<div class="bg-surface-container-low px-4 py-2 rounded-full">
<p class="text-on-surface-variant text-[11px] font-bold uppercase tracking-widest">3.2 km · ~14 min ride</p>
</div>
</div>
</div>
<!-- Sticky Bottom Action Button -->
<footer class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-[#F5F0FF] via-[#F5F0FF]/95 to-transparent">
<button class="w-full h-16 bg-primary-container text-on-primary font-bold text-lg rounded-2xl shadow-[0_16px_32px_rgba(124,58,237,0.3)] active:scale-95 transition-all flex items-center justify-center gap-3">
                Book Auto
                <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</footer>
<!-- Hidden Bottom Nav (Suppressed for focused task) -->
</main>
</body></html>
