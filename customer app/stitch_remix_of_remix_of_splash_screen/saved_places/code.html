<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-variant": "#e5e0ef",
              "outline-variant": "#ccc3d8",
              "inverse-on-surface": "#f3eefd",
              "secondary-fixed": "#e8ddff",
              "on-tertiary-fixed": "#301400",
              "surface-dim": "#dcd8e6",
              "surface-container-lowest": "#ffffff",
              "tertiary-container": "#a15100",
              "surface": "#fcf8ff",
              "on-primary-fixed-variant": "#5a00c6",
              "on-primary": "#ffffff",
              "primary-fixed": "#eaddff",
              "inverse-primary": "#d2bbff",
              "tertiary-fixed-dim": "#ffb784",
              "background": "#fcf8ff",
              "primary-fixed-dim": "#d2bbff",
              "on-background": "#1c1a25",
              "on-secondary-fixed-variant": "#4f319c",
              "on-secondary": "#ffffff",
              "surface-bright": "#fcf8ff",
              "primary": "#630ed4",
              "surface-tint": "#732ee4",
              "on-surface": "#1c1a25",
              "outline": "#7b7487",
              "on-secondary-fixed": "#21005e",
              "secondary-fixed-dim": "#cebdff",
              "on-tertiary": "#ffffff",
              "tertiary-fixed": "#ffdcc6",
              "surface-container": "#f0ecfa",
              "error-container": "#ffdad6",
              "error": "#ba1a1a",
              "on-secondary-container": "#3f1e8c",
              "on-error": "#ffffff",
              "on-error-container": "#93000a",
              "on-tertiary-fixed-variant": "#713700",
              "on-primary-fixed": "#25005a",
              "tertiary": "#7d3d00",
              "secondary": "#674bb5",
              "primary-container": "#7c3aed",
              "on-tertiary-container": "#ffe0cd",
              "surface-container-high": "#ebe6f5",
              "on-surface-variant": "#4a4455",
              "on-primary-container": "#ede0ff",
              "inverse-surface": "#312f3a",
              "surface-container-low": "#f6f1ff",
              "secondary-container": "#ab8ffe",
              "surface-container-highest": "#e5e0ef"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .shadow-soft-lavender {
        box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F5F0FF;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#F5F0FF] text-on-surface min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#F5F0FF]/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 w-full shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-200 ease-in-out text-[#7C3AED]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-semibold tracking-tight text-[#1E1B2E] text-lg">Saved Places</h1>
</div>
<button class="active:scale-95 duration-200 ease-in-out text-[#7C3AED]">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="pt-20 px-6 space-y-6">
<!-- Primary Address Card -->
<section class="bg-surface-container-lowest rounded-[16px] shadow-soft-lavender overflow-hidden">
<!-- Row 1: Home -->
<div class="p-5 flex items-start gap-4 active:bg-surface-container-low transition-colors duration-200">
<div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-white" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div class="flex flex-col">
<span class="font-bold text-[#1E1B2E]">Home</span>
<button class="text-[#7C3AED] text-sm font-medium hover:underline text-left mt-0.5">Add Home Address</button>
</div>
</div>
<div class="mx-5 border-t border-[#F0ECFA]"></div>
<!-- Row 2: Work -->
<div class="p-5 flex items-start gap-4 active:bg-surface-container-low transition-colors duration-200">
<div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-white" data-icon="work" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<div class="flex flex-col">
<span class="font-bold text-[#1E1B2E]">Work</span>
<button class="text-[#7C3AED] text-sm font-medium hover:underline text-left mt-0.5">Add Work Address</button>
</div>
</div>
<div class="mx-5 border-t border-[#F0ECFA]"></div>
<!-- Row 3: Favourites -->
<div class="p-5 flex items-start gap-4 active:bg-surface-container-low transition-colors duration-200">
<div class="w-10 h-10 rounded-full bg-[#A78BFA] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-white" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div class="flex flex-col">
<span class="font-bold text-[#1E1B2E]">Favourites</span>
<span class="text-subtext text-sm">2 places saved</span>
</div>
</div>
</section>
<!-- Add New Place -->
<button class="w-full py-4 flex items-center justify-center gap-2 border-2 border-dashed border-[#A78BFA] rounded-[16px] bg-transparent active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="add">add</span>
<span class="font-bold text-[#7C3AED]">+ Add New Place</span>
</button>
<!-- Section Title -->
<div class="pt-2">
<h2 class="text-[#1E1B2E] font-bold text-xl tracking-tight">My Saved Locations</h2>
</div>
<!-- Custom Saved Places List -->
<div class="space-y-4">
<!-- Place 1 -->
<div class="bg-surface-container-lowest p-5 rounded-[16px] shadow-soft-lavender flex items-center justify-between group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#F6F1FF] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="flex flex-col">
<span class="font-bold text-[#1E1B2E]">Cafe Coffee Day</span>
<span class="text-subtext text-xs leading-relaxed max-w-[180px]">24, MG Road, Bangalore, Karnataka 560001</span>
</div>
</div>
<div class="flex gap-2">
<button class="w-8 h-8 flex items-center justify-center text-[#7C3AED] hover:bg-[#F6F1FF] rounded-full transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
<button class="w-8 h-8 flex items-center justify-center text-error hover:bg-error-container/20 rounded-full transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="delete">delete</span>
</button>
</div>
</div>
<!-- Place 2 -->
<div class="bg-surface-container-lowest p-5 rounded-[16px] shadow-soft-lavender flex items-center justify-between group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#F6F1FF] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="flex flex-col">
<span class="font-bold text-[#1E1B2E]">Central Library</span>
<span class="text-subtext text-xs leading-relaxed max-w-[180px]">Cubbon Park, Ambedkar Veedhi, Bengaluru</span>
</div>
</div>
<div class="flex gap-2">
<button class="w-8 h-8 flex items-center justify-center text-[#7C3AED] hover:bg-[#F6F1FF] rounded-full transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
<button class="w-8 h-8 flex items-center justify-center text-error hover:bg-error-container/20 rounded-full transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="delete">delete</span>
</button>
</div>
</div>
</div>
<!-- Map Thumbnail -->
<div class="relative w-full h-48 rounded-[24px] overflow-hidden shadow-soft-lavender">
<img alt="Map view" class="w-full h-full object-cover grayscale-[0.2] contrast-[1.1]" data-alt="Modern stylized map with purple location markers" data-location="Bangalore" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQ0S3_g6nFXNJ0dtQBdky9x1Q8jmmzdVvApVcNgw7t2-R5j92uLcfNnK4CTjodxC8kcT8JSMc0AmMsaEYaim4fT5Hg3f1i64QqYvF1oZGz2AKK6xZPfVCOslfptKUdJpUro6rdH3NQdiOOBiQc2GhZRupG_V16B4Msyl2qQvhp21fwyfCZep6imk8goFK-Wh-rUz5zSqwvXpmUk7R9zCtLQP92FKGbw3xunL5P8ppBF0Tpt1c62wMSZdbI4tg-sv-c227SyCavFujX"/>
<div class="absolute inset-0 bg-[#7C3AED]/10 pointer-events-none"></div>
<!-- Custom map pins overlay -->
<div class="absolute top-1/2 left-1/3">
<span class="material-symbols-outlined text-[#7C3AED] text-3xl" data-icon="location_on" style="font-variation-settings: 'FILL' 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));">location_on</span>
</div>
<div class="absolute top-1/4 right-1/4">
<span class="material-symbols-outlined text-[#7C3AED] text-3xl" data-icon="location_on" style="font-variation-settings: 'FILL' 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));">location_on</span>
</div>
<div class="absolute bottom-1/4 right-1/2">
<span class="material-symbols-outlined text-[#7C3AED] text-3xl" data-icon="location_on" style="font-variation-settings: 'FILL' 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));">location_on</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
</body></html>
