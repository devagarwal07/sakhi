<style>
        body { font-family: 'Inter', sans-serif; }
        .emergency-bg { background-color: #92400E; }
        .ripple {
            position: absolute;
            border: 4px solid rgba(255, 165, 0, 0.5);

            width: 120px;
            height: 120px;
            animation: ripple-out 2s infinite ease-out;
        }
        @keyframes ripple-out {
            0% { transform: scale(1); opacity: 1; }

<body class="emergency-bg min-h-screen flex flex-col items-center justify-center p-6 overflow-hidden">
<div class="w-full max-w-[390px] h-[844px] flex flex-col justify-between py-12">
<!-- Top Section: Visual Indicator -->
<div class="flex flex-col items-center justify-center flex-grow">
<div class="relative flex items-center justify-center mb-12">
<div class="ripple"></div>
<div class="ripple" style="animation-delay: 0.5s;"></div>
<div class="z-10 bg-white rounded-full p-8 flex items-center justify-center shadow-2xl">
<span class="material-symbols-outlined text-[64px] text-[#92400E]" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
</div>
<div class="text-center px-4">
<h1 class="text-white text-4xl font-bold tracking-tight mb-4">Are you in danger?</h1>
<p class="text-white/90 text-lg font-light leading-relaxed">
                    Your emergency contacts and Sakhi team will be notified immediately.
                </p>
</div>
</div>
<!-- Middle Section: Actions -->
<div class="flex flex-col gap-4 w-full px-2 mb-8">
<button class="flex items-center justify-center bg-error text-white font-bold text-lg py-5 px-6 rounded-xl red-glow active:scale-[0.98] transition-transform">
<span class="mr-2">🚨</span> YES — Send SOS Alert
            </button>
<button class="flex items-center justify-center bg-white text-on-surface font-bold text-lg py-5 px-6 rounded-xl active:scale-[0.98] transition-transform shadow-lg">
                No, I'm Safe — Go Back
            </button>
</div>
<!-- Bottom Section: Countdown & Logic -->
<div class="w-full px-2 flex flex-col gap-4">
<div class="bg-white/10 backdrop-blur-md rounded-full px-6 py-2 self-center">
<p class="text-white text-sm font-medium">Sending automatically in 5…4…3…</p>
</div>
<div class="w-full h-3 bg-white/20 rounded-full overflow-hidden">
<div class="h-full bg-error rounded-full" style="width: 60%;"></div>
</div>
<p class="text-white/80 text-xs text-center font-normal tracking-wide">
                SOS will auto-send if no response.
            </p>
</div>
</div>
