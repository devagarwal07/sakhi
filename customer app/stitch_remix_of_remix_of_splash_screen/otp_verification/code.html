<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

              "error": "#ba1a1a",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F0FF;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#F5F0FF]/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<div class="flex items-center">
<button class="text-primary hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[28px]" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<div class="absolute left-1/2 -translate-x-1/2">
<h1 class="text-2xl font-bold text-primary tracking-tighter">Sakhi</h1>
</div>
<div class="w-7"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-grow pt-32 px-8 flex flex-col items-center">
<!-- Heading Section -->
<div class="text-center mb-10">
<h2 class="text-headline-lg text-[2rem] font-bold text-on-surface tracking-tight mb-3">Verify Your Number</h2>
<p class="text-subtext text-[#6B7280] leading-relaxed max-w-[280px] mx-auto">
                We sent a 6-digit code to <span class="whitespace-nowrap font-medium">+91 98765 43210</span> · 
                <button class="text-primary font-semibold hover:underline">Edit</button>
</p>
</div>
<!-- OTP Inputs Grid -->
<div class="flex gap-2.5 justify-center mb-8">
<!-- First box is Active/Focused State -->
<div class="w-12 h-14 bg-surface-container-lowest border-2 border-primary rounded-xl flex items-center justify-center shadow-[0_0_12px_rgba(124,58,237,0.15)] overflow-hidden">
<span class="w-[2px] h-6 bg-primary animate-pulse"></span>
</div>
<!-- Inactive Boxes -->
<div class="w-12 h-14 bg-surface-container-lowest border border-outline-variant/30 rounded-xl flex items-center justify-center"></div>
<div class="w-12 h-14 bg-surface-container-lowest border border-outline-variant/30 rounded-xl flex items-center justify-center"></div>
<div class="w-12 h-14 bg-surface-container-lowest border border-outline-variant/30 rounded-xl flex items-center justify-center"></div>
<div class="w-12 h-14 bg-surface-container-lowest border border-outline-variant/30 rounded-xl flex items-center justify-center"></div>
<div class="w-12 h-14 bg-surface-container-lowest border border-outline-variant/30 rounded-xl flex items-center justify-center"></div>
</div>
<!-- Countdown -->
<div class="flex flex-col items-center">
<div class="flex items-center gap-2 text-[#6B7280]">
<span class="material-symbols-outlined text-[18px]" data-icon="schedule">schedule</span>
<p class="text-sm font-medium tracking-wide">Resend OTP in 0:28</p>
</div>
</div>
<!-- Illustration / Visual Anchor -->
<div class="mt-16 opacity-40">
<div class="w-32 h-32 rounded-full bg-gradient-to-br from-primary/20 to-secondary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="lock_open">lock_open</span>
</div>
</div>
</main>
<!-- Sticky Bottom CTA Section -->
<footer class="p-8 pb-10 bg-gradient-to-t from-[#F5F0FF] to-transparent">
<button class="w-full h-14 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-lg rounded-xl shadow-[0_16px_32px_rgba(124,58,237,0.2)] hover:translate-y-[-2px] active:scale-95 transition-all duration-300">
            Verify &amp; Continue
        </button>
<div class="mt-6 text-center">
<p class="text-[11px] text-[#6B7280] uppercase tracking-[0.1em]">By continuing, you agree to Sakhi's Security Policy</p>
</div>
</footer>
<!-- Decorative Elements for "Ethereal Editorial" feel -->
<div class="fixed top-[-10%] right-[-10%] w-64 h-64 bg-primary/5 rounded-full blur-[80px] -z-10"></div>
<div class="fixed bottom-[5%] left-[-15%] w-80 h-80 bg-secondary/10 rounded-full blur-[100px] -z-10"></div>
