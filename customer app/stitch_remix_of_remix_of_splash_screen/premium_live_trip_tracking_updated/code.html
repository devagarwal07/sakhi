<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary": "#ffffff",
              "surface-variant": "#e5e0ef",
              "surface-container-low": "#f6f1ff",
              "surface-bright": "#fcf8ff",
              "primary-fixed-dim": "#d2bbff",
              "primary-fixed": "#eaddff",
              "on-surface": "#1c1a25",
              "secondary": "#674bb5",
              "surface-dim": "#dcd8e6",
              "outline": "#7b7487",
              "on-primary-fixed": "#25005a",
              "on-primary-container": "#ede0ff",
              "on-background": "#1c1a25",
              "primary-container": "#7c3aed",
              "on-secondary": "#ffffff",
              "background": "#fcf8ff",
              "inverse-on-surface": "#f3eefd",
              "surface-container-lowest": "#ffffff",
              "secondary-fixed-dim": "#cebdff",
              "secondary-fixed": "#e8ddff",
              "on-secondary-fixed-variant": "#4f319c",
              "primary": "#630ed4",
              "tertiary-fixed": "#ffdcc6",
              "on-tertiary-container": "#ffe0cd",
              "tertiary": "#7d3d00",
              "inverse-primary": "#d2bbff",
              "surface": "#fcf8ff",
              "on-surface-variant": "#4a4455",
              "tertiary-container": "#a15100",
              "on-tertiary-fixed": "#301400",
              "on-error-container": "#93000a",
              "on-error": "#ffffff",
              "tertiary-fixed-dim": "#ffb784",
              "surface-container-high": "#ebe6f5",
              "surface-container": "#f0ecfa",
              "error": "#ba1a1a",
              "surface-container-highest": "#e5e0ef",
              "error-container": "#ffdad6",
              "on-primary-fixed-variant": "#5a00c6",
              "on-tertiary-fixed-variant": "#713700",
              "outline-variant": "#ccc3d8",
              "surface-tint": "#732ee4",
              "on-secondary-fixed": "#21005e",
              "on-tertiary": "#ffffff",
              "secondary-container": "#ab8ffe",
              "on-secondary-container": "#3f1e8c",
              "inverse-surface": "#312f3a"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .route-line {
        stroke-dasharray: 8;
        animation: dash 20s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -100;
        }
      }
      .pulse-ring {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden flex justify-center items-start min-h-screen">
<main class="relative w-[390px] h-[884px] overflow-hidden bg-[#F5F0FF] shadow-2xl">
<!-- Map Background Mockup (Top 62%) -->
<div class="absolute top-0 left-0 w-full h-[62%] z-0">
<div class="absolute inset-0 bg-surface-container-low opacity-50"></div>
<!-- Mock Map Pattern -->
<svg class="absolute inset-0 w-full h-full opacity-30" viewbox="0 0 390 548" xmlns="http://www.w3.org/2000/svg">
<path d="M-50 200 L450 250 M-50 400 L450 380 M100 -50 L120 900 M280 -50 L260 900" fill="none" stroke="#7C3AED" stroke-width="2"></path>
<!-- Route Line -->
<path class="route-line" d="M115 450 Q 150 350, 280 250 T 265 100" fill="none" stroke="#7C3AED" stroke-linecap="round" stroke-width="6"></path>
<!-- Pickup Point -->
<circle cx="115" cy="450" fill="#A78BFA" r="8" stroke="white" stroke-width="2"></circle>
<!-- Auto Icon (Mock) -->
<g transform="translate(195, 310) rotate(-35)">
<rect class="shadow-lg" fill="#7C3AED" height="24" rx="6" width="24" x="-12" y="-12"></rect>
</g>
</svg>
<span class="material-symbols-outlined text-white text-xs" style="position: absolute; transform: translate(189px, 304px);">electric_rickshaw</span>
<!-- Destination Marker -->
<g transform="translate(265, 80)">
<path d="M265 80 L255 55 A 12 12 0 1 1 275 55 Z" fill="#630ed4" style="position: absolute;"></path>
<div class="absolute top-16 right-20 px-3 py-1 bg-primary text-white text-[10px] font-bold rounded-full tracking-wider shadow-lg">HOME</div>
</g>
</div>
<!-- Top App Bar -->
<header class="absolute top-0 w-full z-50 flex items-center justify-between px-6 h-20 bg-transparent">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white text-primary shadow-sm active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="glass-card px-6 py-2.5 rounded-full shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<span class="text-primary font-headline font-semibold tracking-tight text-sm">Heading to Destination</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white text-primary shadow-sm active:scale-95 duration-200">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Floating Map Controls -->
<div class="absolute right-4 top-24 flex flex-col gap-3 z-10">
<button class="w-12 h-12 bg-white rounded-xl shadow-[0_8px_24px_rgba(124,58,237,0.1)] flex items-center justify-center text-primary">
<span class="material-symbols-outlined">my_location</span>
</button>
<button class="w-12 h-12 bg-white rounded-xl shadow-[0_8px_24px_rgba(124,58,237,0.1)] flex items-center justify-center text-primary">
<span class="material-symbols-outlined">layers</span>
</button>
</div>
<!-- Bottom Sheet (38% Height) -->
<section class="absolute bottom-0 w-full h-[38%] bg-white rounded-t-[32px] shadow-[0_-16px_48px_rgba(124,58,237,0.12)] z-40 overflow-hidden flex flex-col">
<!-- Handle -->
<div class="flex justify-center pt-3 pb-2">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<div class="px-6 flex-1 overflow-y-auto pb-24">
<!-- Status Row -->
<div class="flex items-center gap-2 mb-4">
<div class="w-2.5 h-2.5 bg-green-500 rounded-full pulse-ring"></div>
<span class="text-[11px] font-bold uppercase tracking-[0.1em] text-green-600">Trip in Progress</span>
</div>
<!-- Primary ETA Info -->
<div class="mb-6">
<div class="flex items-center gap-2 text-primary mb-1">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">schedule</span>
<h2 class="text-3xl font-headline font-extrabold tracking-tight text-on-surface">Arriving in 9 mins</h2>
</div>
<p class="text-on-surface-variant font-medium ml-8 text-sm">4.1 km remaining • On time</p>
</div>
<!-- Driver Profile Card -->
<div class="bg-surface-container-low p-4 rounded-2xl mb-6 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="relative">
<img alt="Meena R." class="w-14 h-14 rounded-full object-cover border-2 border-white" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEDqfORorEZyEA_vySKo2m1gu6Glub3k9u6nnnCmy1Erl0h8uDHPlL7tl4-xVU7ENuJ5RifsS6MtscCy-z2O4ZZGHT1RCYlDnLJI6Kg1Z-XuOUQUwCoDILynirFnDKmmFvSFrm_Y2XvkvLFpYMDoFg9TOziJiTgq626xvywRMhFlecVjLVQjOyanh1W74xBudk0hkhCaXU0lqHDtNwSsLN2bSc4nFEaaiHXXvtYKyZmT_E7HV8XUWW1o-Fc-Z2cBokOhHM3I2SqWGH"/>
<div class="absolute -bottom-1 -right-1 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md flex items-center gap-0.5 shadow-sm">
                            4.9 <span class="material-symbols-outlined text-[10px]" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<div>
<h3 class="font-headline font-bold text-on-surface text-base">Meena R.</h3>
<p class="text-on-surface-variant text-xs font-medium">Sakhi Elite • GJ01 AB 1234</p>
</div>
</div>
<!-- Call button removed per request -->
</div>
<!-- Safety Actions -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-secondary-fixed text-on-secondary-fixed-variant font-bold py-4 px-4 rounded-xl shadow-sm hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined text-xl">ios_share</span>
<span class="text-sm">Share Trip</span>
</button>
<button class="flex items-center justify-center gap-2 bg-[#FEE2E2] text-error font-bold py-4 px-4 rounded-xl shadow-sm hover:bg-[#FECACA] active:scale-95 transition-all">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">emergency_home</span>
<span class="text-sm">SOS</span>
</button>
</div>
</div>
</section>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-[390px] flex justify-around items-center px-4 pb-6 pt-3 bg-white/90 backdrop-blur-2xl rounded-t-[32px] shadow-[0_-16px_32px_rgba(124,58,237,0.08)] z-50">
<button class="flex flex-col items-center gap-1 text-primary bg-[#F5F0FF] rounded-2xl px-4 py-2 transition-all duration-300 translate-y-[-2px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-semibold">Home</span>
</button>
<button class="flex flex-col items-center gap-1 text-[#6B7280] hover:text-primary transition-all duration-300">
<span class="material-symbols-outlined">local_taxi</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-semibold">Activity</span>
</button>
<button class="flex flex-col items-center gap-1 text-[#6B7280] hover:text-primary transition-all duration-300">
<span class="material-symbols-outlined">shield_with_heart</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-semibold">Safety</span>
</button>
<button class="flex flex-col items-center gap-1 text-[#6B7280] hover:text-primary transition-all duration-300">
<span class="material-symbols-outlined">person</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-semibold">Profile</span>
</button>
</nav>
</main>
</body></html>
