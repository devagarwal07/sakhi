<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; background-color: #fcf8ff; }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(252, 248, 255, 0.4) 0%, rgba(252, 248, 255, 0) 20%);
        }
        .custom-shadow {
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased text-on-background overflow-hidden">
<!-- Main Navigation Container (Mobile 390x844 Frame Emulation) -->
<div class="relative w-full h-screen max-w-[390px] mx-auto overflow-hidden bg-surface shadow-2xl">
<!-- TopAppBar Navigation Shell -->
<header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl text-violet-700 dark:text-violet-400 font-inter font-bold tracking-tight text-lg fixed top-4 left-4 right-4 rounded-2xl flex items-center justify-between px-6 py-4 z-50 tonal-nesting shadow-lg shadow-violet-500/10 shadow-[16px_32px_rgba(124,58,237,0.08)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined style_primary_color">navigation</span>
<h1 class="font-headline font-bold text-violet-800 tracking-tight">Heading North on Broadway</h1>
</div>
<button class="hover:bg-violet-50 dark:hover:bg-violet-900/30 transition-all active:scale-95 duration-200 p-1 rounded-full">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Map Section (62% Height) -->
<section class="relative h-[62%] w-full">
<!-- Map Background -->
<div class="absolute inset-0 bg-surface-container">
<img alt="Detailed city street map showing Broadway area" class="w-full h-full object-cover opacity-80 grayscale-[20%] contrast-[90%] brightness-[105%]" data-alt="Detailed city street map showing Broadway area" data-location="New York" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCdeYFjNM-cybQcLEB-ojkbU4EknL8zQGGZghgntp4GFzLDdfvgiKqLAK0WADugqecPyt4iLdCXNyZbpKs8F9UpvxBIsm7eBDaHarur90hr5auFXekjR665M0_tgZUaJlwpnOdgBASIlsyE9iItu5tulBtWsROW4uM9Tdbcb7-CQHOv3ttuUWhK2rXCWTUKWJQtPtqY_MQ-VviYBzbw2dwhXGio5PE1Sx5fHdNIKR5BdHqWcB5-k5gsvdBVO7KD8di3YXZ04rvnw7x_"/>
<div class="absolute inset-0 map-gradient-overlay"></div>
</div>
<!-- Arrived Top Banner -->
<div class="absolute top-24 left-1/2 -translate-x-1/2 w-[90%] z-40">
<div class="bg-surface-container-lowest rounded-2xl p-4 flex items-center gap-4 custom-shadow">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div>
<p class="text-sm font-label uppercase tracking-widest text-primary-container font-bold">Current Point</p>
<h2 class="text-xl font-headline font-extrabold text-on-surface">Arrived at Pickup</h2>
</div>
</div>
</div>
<!-- Stationary Auto Icon at Pickup -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-30">
<div class="relative">
<div class="absolute -inset-4 bg-primary/20 rounded-full blur-xl animate-pulse"></div>
<div class="relative bg-primary-container w-10 h-10 rounded-full border-4 border-surface-container-lowest flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-primary text-xl" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
</div>
</div>
<!-- SOS Floating Pill -->
<div class="absolute bottom-6 left-6 z-40">
<button class="bg-error px-4 py-2.5 rounded-full flex items-center gap-2 shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-on-error text-lg" style="font-variation-settings: 'FILL' 1;">emergency</span>
<span class="text-on-error font-headline font-bold text-xs uppercase tracking-wider">SOS</span>
</button>
</div>
</section>
<!-- Bottom Sheet (38% Height) -->
<section class="h-[38%] w-full bg-surface-container-lowest rounded-t-[32px] relative z-50 custom-shadow flex flex-col">
<!-- Handle -->
<div class="w-12 h-1.5 bg-surface-container-highest rounded-full mx-auto mt-3"></div>
<div class="px-6 pt-4 flex-1 flex flex-col justify-between pb-8">
<!-- Rider Row -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="relative">
<img alt="Profile picture of Priya S." class="w-14 h-14 rounded-2xl object-cover" data-alt="Profile portrait of a smiling woman" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZ-N4Wftal01Clp9tm-Nhmz4_7Ivu6c8iSHYIEdimXYP-AbN9Aax16iJgvrdxfvXCxBZEjjBONFleY0c6k7ovyaZzR_vYK1Iq-Hqz0i1et_dhbTrmWVKflfFXv5APtx2Ub7CjpG2JR41vHttUVQxClbNX9Lo7HLsZl0k60-rJ0XWBHWBx7_4FIFoVTHB5PfvEhJpbCZdzH1nxINzlz5Lnr4Pw9DbNksYNQpweNORQihmlStBfsHWGdXSRgRV2pgWn-3R45tkdhzlSg"/>
<div class="absolute -bottom-1 -right-1 bg-primary-container border-2 border-surface-container-lowest p-1 rounded-lg">
<span class="material-symbols-outlined text-[10px] text-on-primary">chat_bubble</span>
</div>
</div>
<div>
<h3 class="text-lg font-headline font-bold text-on-surface">Priya S.</h3>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-amber-500 text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-on-surface-variant font-body font-medium text-sm">4.7 ★</span>
</div>
</div>
</div>
<div class="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-xl border border-emerald-100/50 flex items-center gap-1.5">
<div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
<span class="text-xs font-headline font-bold uppercase tracking-wide">Arrived</span>
</div>
</div>
<!-- Waiting Timer Card -->
<div class="bg-surface-container-low rounded-2xl p-4 mt-4 relative overflow-hidden">
<div class="flex justify-between items-center mb-2">
<span class="text-on-surface-variant font-label text-xs font-bold uppercase tracking-tight">Free waiting</span>
<span class="text-primary font-headline font-black text-lg">2:45</span>
</div>
<!-- Depleting Bar Container -->
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[70%] rounded-full opacity-80"></div>
</div>
</div>
<!-- Primary Action -->
<button class="mt-6 w-full bg-emerald-600 h-16 rounded-2xl flex items-center justify-center gap-3 active:scale-[0.98] transition-all shadow-lg shadow-emerald-500/20">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="text-white font-headline font-extrabold text-lg tracking-tight">Start Trip</span>
</button>
</div>
</section>
<!-- BottomNavBar (Hidden or Inactive for focused navigation) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-8 pt-4 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-t-[32px] shadow-[0_-8px_32px_rgba(124,58,237,0.06)] hidden md:hidden">
<div class="flex flex-col items-center justify-center bg-violet-100 dark:bg-violet-900/40 text-violet-700 dark:text-violet-200 rounded-2xl px-5 py-2">
<span class="material-symbols-outlined">explore</span>
<span class="font-inter text-[10px] font-medium tracking-wide uppercase mt-1">Navigate</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2">
<span class="material-symbols-outlined">payments</span>
<span class="font-inter text-[10px] font-medium tracking-wide uppercase mt-1">Earnings</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2">
<span class="material-symbols-outlined">chat_bubble</span>
<span class="font-inter text-[10px] font-medium tracking-wide uppercase mt-1">Inbox</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2">
<span class="material-symbols-outlined">person</span>
<span class="font-inter text-[10px] font-medium tracking-wide uppercase mt-1">Account</span>
</div>
</nav>
</div>
</body></html>
