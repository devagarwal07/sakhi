<style>
        .soft-lavender-shadow {
            box-shadow: 0 16px 32px 0 rgba(124, 58, 237, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-[#F5F0FF] font-body text-on-surface min-h-screen flex flex-col items-center">
<!-- Top Navigation Shell -->
<header class="w-full top-0 sticky backdrop-blur-xl bg-opacity-80 flex items-center justify-between px-6 py-4 z-50">
<div class="flex items-center justify-start w-10">
<button class="text-[#7C3AED] active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<div class="flex-grow text-center">
<span class="font-headline font-semibold tracking-tight text-[#1E1B2E]">Sakhi</span>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="w-full max-w-[390px] px-6 flex flex-col items-center pt-8 pb-32">
<!-- Brand/Safety Icon -->
<div class="w-20 h-20 bg-surface-container-lowest rounded-full flex items-center justify-center mb-8 soft-lavender-shadow">
<span class="material-symbols-outlined text-[#7C3AED] text-4xl" data-icon="shield_person">shield_person</span>
</div>
<!-- Header Content -->
<div class="text-center mb-10">
<h1 class="font-headline text-2xl font-bold text-[#1E1B2E] tracking-tight mb-3">Verify Your Identity</h1>
<p class="text-[#6B7280] text-sm leading-relaxed px-4">Only verified women drivers can join Sakhi.</p>
</div>
<!-- Verification Cards -->
<div class="w-full space-y-4">
<!-- Card 1: Aadhaar -->
<div class="w-full bg-[#FFFFFF] rounded-2xl p-5 flex items-center gap-4 soft-lavender-shadow border border-white/50 cursor-pointer active:scale-[0.98] transition-all">
<div class="w-12 h-12 bg-surface-container-low rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="badge">badge</span>
</div>
<div class="flex-grow">
<h3 class="font-bold text-[#1E1B2E] text-base">Upload Aadhaar</h3>
<p class="text-[#6B7280] text-xs mt-0.5">Upload front &amp; back of your Aadhaar card</p>
</div>
<span class="material-symbols-outlined text-[#7C3AED] opacity-40" data-icon="chevron_right">chevron_right</span>
</div>
<!-- Card 2: Face Scan -->
<div class="w-full bg-[#FFFFFF] rounded-2xl p-5 flex items-center gap-4 soft-lavender-shadow border border-white/50 cursor-pointer active:scale-[0.98] transition-all">
<div class="w-12 h-12 bg-surface-container-low rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="face">face</span>
</div>
<div class="flex-grow">
<h3 class="font-bold text-[#1E1B2E] text-base">Face Scan</h3>
<p class="text-[#6B7280] text-xs mt-0.5">Quick camera-based identity verification</p>
</div>
<span class="material-symbols-outlined text-[#7C3AED] opacity-40" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<!-- Empty state/Illustration placeholder if needed for editorial feel -->
<div class="mt-12 opacity-10 grayscale">
<img alt="Identity security illustration" class="w-32 h-32 object-contain" data-alt="Abstract purple geometric security shield pattern" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCd7fjxm7cfMCTUdZTAliUduPrfFALFXsD5LkgPoxSHe4REmybz1X1aEAdBufxgic00GZCKINnSrtHcGHkl8UnYAWjPdRRNoVcg4NT2_IAMhRfBQdCEPFsIm1i_Y6f2y-JO2fpLVuSrTnNTsId4kA50ALaD4l1SS0wiagSrwQBRt6sCAzPuxvgBqVBvPDIsPHzmYPUZ2OY7KO20BYHzmgT99HXKQuKvLamB_CDnFTTKlEpc5U2BEGKxO9CfsxIxMbB2e8WM1TWf3asu"/>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 w-full max-w-[390px] px-6 py-8 bg-gradient-to-t from-[#F5F0FF] via-[#F5F0FF] to-transparent">
<button class="w-full py-4 bg-gradient-to-r from-[#7C3AED] to-[#630ED4] text-white font-bold rounded-xl active:scale-95 transition-transform soft-lavender-shadow">
            Continue
        </button>
</div>
</body></html>
