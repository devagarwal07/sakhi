<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-container": "#f0ecfa",
                        "secondary-container": "#ab8ffe",
                        "on-secondary-fixed-variant": "#4f319c",
                        "surface": "#fcf8ff",

                        "tertiary-fixed-dim": "#ffb784",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "primary-container": "#7c3aed",
                        "primary-fixed": "#eaddff",
                        "on-tertiary-fixed-variant": "#713700",
                        "on-tertiary-container": "#ffe0cd",
                        "error-container": "#ffdad6",
                        "primary": "#630ed4",
                        "on-background": "#1c1a25",
                        "inverse-primary": "#d2bbff",
                        "secondary": "#674bb5",
                        "surface-container-low": "#f6f1ff",
                        "on-primary-fixed": "#25005a",
                        "inverse-surface": "#312f3a",

                        "tertiary-container": "#a15100",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#5a00c6",
                        "on-primary-container": "#ede0ff",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f3eefd",
                        "surface-variant": "#e5e0ef",
                        "background": "#fcf8ff",
                        "outline-variant": "#ccc3d8"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},

            },

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(245, 240, 255, 0.4), rgba(245, 240, 255, 0));
        }
        .soft-lavender-shadow {
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- Top Navigation Shell -->
<header class="fixed top-0 w-full z-50 bg-[#F5F0FF]/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="arrow_back">arrow_back</span>
<span class="font-['Inter'] font-semibold tracking-tight text-lg text-[#1E1B2E]">Arrived</span>
</div>
<span class="material-symbols-outlined text-[#7C3AED]" data-icon="more_vert">more_vert</span>
</header>
<main class="relative h-screen w-full flex flex-col">
<!-- Map Section (Top 50%) -->
<section class="h-1/2 w-full relative overflow-hidden bg-surface-container-low">
<div class="absolute inset-0 map-gradient-overlay z-10 pointer-events-none"></div>
<img alt="Pastel map of city streets" class="w-full h-full object-cover opacity-60" data-alt="Pastel colored stylized city map for navigation" data-location="Bangalore" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmw4_rbP3jkK0SpkeP_OAlPpYZDMgYR0K0zc02Iv_ZYkHbovd2KEU8nFORLY_y6BxEcgMoV90CUoI6wn6gGxEnFgZfd1YyeupaBNkxvkKaBbXTCOKmvb_LjSALrvCa6g5MSPn15uXFnXO5qcssy3IUTzSC0HxD8EdcrA9nNzsvQix5UTNU7CCgO73lBkHH6x4lE1x9ChqUdTVECvJwF5nBm0R4vBmk1DOC1QrwvKlUtboLXFpgDK6z06yu7MVn0I2lBpwr7MTvi7We"/>
<!-- Driver Pin & Badge -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-3">
<div class="bg-emerald-500 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-lg flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">fiber_manual_record</span>
                    Arrived
                </div>
<div class="relative">
<div class="absolute -inset-4 bg-primary/20 rounded-full animate-pulse"></div>
<div class="bg-surface-container-lowest p-2 rounded-full soft-lavender-shadow relative z-20">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="local_taxi" style="font-variation-settings: 'FILL' 1;">local_taxi</span>
</div>
</div>
</div>
</section>
<!-- Bottom Sheet (White, rounded top) -->
<section class="h-1/2 bg-surface-container-lowest rounded-t-[48px] shadow-[0_-16px_48px_rgba(124,58,237,0.12)] relative z-40 -mt-12 flex flex-col overflow-y-auto">
<div class="w-12 h-1.5 bg-surface-container-high rounded-full mx-auto mt-4 mb-6"></div>
<div class="px-6 space-y-8">
<!-- Status Badge -->
<div class="bg-emerald-50 border-2 border-emerald-500/20 rounded-2xl p-4 flex items-center justify-center gap-3">
<span class="text-emerald-500 material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-emerald-900 font-bold tracking-tight">Your Driver Has Arrived!</span>
</div>
<!-- Driver Row -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="relative">
<img alt="Driver portrait Meena R." class="w-16 h-16 rounded-2xl object-cover" data-alt="Professional portrait of a female driver smiling" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAPXUSLnGFSGFhKcyBkRB9MdiiA_OibvlhPoQc7SVkkO5lE5f5dEwkDWjVQeP_rDhmBqJgMlpAZoeQxNs0EiJUSe3pw-yQTNQrZX3JtNRwuWH6HcSzKZh7K7mVyzAkeZdRjYZ4XoJBBlmqfp2IT4xL9i7AUXgRUAbWJzIhpzHyPtOk1Nm8SrfO-Ui0QNXEEfteE9Zk8EOqAoB1k6oB-3Lt8hEev0miKqfHAnFbiD1LgQ5A0PSWwNZrczAOD8_l4T5PMkyUZFIERvfi"/>
<div class="absolute -bottom-1 -right-1 bg-primary text-white text-[10px] px-2 py-0.5 rounded-full font-bold">4.9 ★</div>
</div>
<div>
<h3 class="text-on-surface font-bold text-lg leading-tight">Meena R.</h3>
<p class="text-subtext text-sm font-medium">Auto · KA 05 AB 1234</p>
</div>
</div>
<div class="flex gap-2">
<button class="w-12 h-12 rounded-xl bg-surface-container-low text-primary flex items-center justify-center active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="call">call</span>
</button>
<button class="w-12 h-12 rounded-xl bg-primary text-white flex items-center justify-center active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="chat_bubble">chat_bubble</span>
</button>
</div>
</div>
<!-- Waiting Timer Card -->
<div class="bg-surface-container-lowest rounded-2xl p-6 soft-lavender-shadow border border-outline-variant/10">
<div class="flex justify-between items-center mb-4">
<span class="text-[10px] uppercase tracking-widest font-bold text-subtext">Free Waiting Window</span>
<span class="text-[10px] uppercase tracking-widest font-bold text-subtext">3:00 mins</span>
</div>
<div class="flex flex-col items-center mb-6">
<div class="text-[56px] font-extrabold text-on-surface tracking-tighter leading-none mb-4">2:34</div>
<div class="w-full h-1.5 bg-surface-container-low rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-2/3 rounded-full"></div>
</div>
</div>
<div class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-emerald-500 text-sm">info</span>
<p class="text-emerald-600 text-[11px] font-semibold uppercase tracking-wider">No waiting charges yet</p>
</div>
</div>
<!-- Bottom Actions -->
<div class="flex items-center justify-between pb-12 pt-4">
<button class="flex items-center gap-2 bg-error/10 text-error px-5 py-3 rounded-full active:scale-95 transition-all">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">emergency</span>
<span class="text-xs font-bold uppercase tracking-widest">SOS</span>
</button>
<button class="flex items-center gap-2 bg-secondary-container/20 text-secondary px-6 py-3 rounded-full active:scale-95 transition-all">
<span class="material-symbols-outlined text-sm">share</span>
<span class="text-xs font-bold uppercase tracking-widest">Share Trip</span>
</button>
</div>
</div>
</section>
</main>
<!-- Navigation Shell Placeholder -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-white/90 backdrop-blur-xl rounded-t-[32px] shadow-[0_-16px_32px_rgba(124,58,237,0.08)] z-50">
<div class="flex flex-col items-center justify-center bg-[#F5F0FF] text-[#7C3AED] rounded-[16px] px-4 py-2">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7280] px-4 py-2">
<span class="material-symbols-outlined" data-icon="local_taxi">local_taxi</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Activity</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7280] px-4 py-2">
<span class="material-symbols-outlined" data-icon="shield_with_heart">shield_with_heart</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Safety</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7280] px-4 py-2">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Profile</span>
</div>
</nav>
</body></html>
