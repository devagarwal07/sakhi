<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(245, 240, 255, 0.2), rgba(245, 240, 255, 0.5));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-[#F5F0FF] font-body text-on-surface antialiased overflow-hidden">
<!-- Top Navigation Bar (Shared Component Logic) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-[#F5F0FF] dark:bg-slate-950/80 backdrop-blur-xl shadow-[0_16px_32px_rgba(124,58,237,0.08)]">
<div class="flex items-center gap-4">
<button class="text-[#7C3AED] dark:text-[#A78BFA] active:scale-95 duration-200 hover:bg-[#F6F1FF] p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-xl font-black text-[#1E1B2E] dark:text-[#F5F0FF] font-['Inter'] tracking-tight">Sakhi</h1>
</div>
<button class="text-[#7C3AED] dark:text-[#A78BFA] active:scale-95 duration-200 hover:bg-[#F6F1FF] p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="relative h-[844px] w-[390px] mx-auto overflow-hidden bg-surface shadow-2xl">
<!-- Map View (Top 55%) -->
<section class="relative h-[55%] w-full">
<!-- Muted Map Background -->
<div class="absolute inset-0 bg-[#E5E0EF]">
<img class="w-full h-full object-cover opacity-60 grayscale-[0.3]" data-alt="Muted pastel map of New Delhi with lavender and grey tones" data-location="New Delhi" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCCkXPK3fkmmf83ijEeyvKOKtHzID8VC_ICWg9jAHfmDQCKD6OADpexWlo8dkFEReb4PIfREmX9aH2jSUv3ukUtQbU4zF1HgrvMP4tqoY0WW26Y6UWgk7ky4oGqto-h7AAqjKQmwi-1w22s9LNXfiqCqmjY8gAMLUgeSsEKfjuaLoT5XoalQPolnebI9rvVzRhQUT5DfNBU5pTbx-JUHHr61UubXmw_z_Gtc5IFn1mune84N0O_37i5AY2n7HzOn7hI_2O1JphXscwm"/>
<div class="absolute inset-0 map-gradient-overlay"></div>
</div>
<!-- Animated Pickup Pin -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="relative">
<!-- Ripple Rings -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 rounded-full border-2 border-[#7C3AED]/30 pulse-ring"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 rounded-full border-2 border-[#7C3AED]/20 pulse-ring" style="animation-delay: 0.5s;"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full border-2 border-[#7C3AED]/10 pulse-ring" style="animation-delay: 1s;"></div>
<!-- Main Pin -->
<div class="relative z-10 text-[#7C3AED]">
<span class="material-symbols-outlined text-5xl" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
</div>
</section>
<!-- Bottom Sheet (Bottom 45%) -->
<section class="absolute bottom-0 w-full h-[45%] bg-white rounded-t-[24px] shadow-[0_-16px_32px_rgba(124,58,237,0.08)] px-6 pt-6 pb-8 flex flex-col items-center">
<!-- Drag Handle -->
<div class="w-12 h-1 bg-surface-variant rounded-full mb-6"></div>
<!-- Finding Animation -->
<div class="relative flex items-center justify-center mb-4">
<div class="absolute w-16 h-16 rounded-full border-4 border-[#7C3AED]/20 pulse-ring"></div>
<div class="w-14 h-14 bg-[#F5F0FF] rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[#7C3AED] text-3xl" data-icon="rickshaw">electric_rickshaw</span>
</div>
</div>
<!-- Header -->
<div class="text-center mb-6">
<h2 class="text-xl font-bold text-[#1E1B2E] tracking-tight mb-1">Finding Your Driver…</h2>
<p class="text-sm text-[#6B7280]">Matching you with the nearest Sakhi driver</p>
</div>
<!-- Divider -->
<div class="w-full h-[1px] bg-[#F5F0FF] mb-6"></div>
<!-- Info Rows -->
<div class="w-full space-y-4 mb-6">
<!-- Pickup Row -->
<div class="flex items-center gap-4">
<div class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></div>
<div class="flex-1">
<p class="text-xs text-[#6B7280] uppercase tracking-widest font-medium">Pickup</p>
<p class="text-sm font-semibold text-[#1E1B2E] line-clamp-1">12, Green Park Avenue, New Delhi</p>
</div>
</div>
<!-- Drop Row -->
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#7C3AED] text-lg shrink-0" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="flex-1">
<p class="text-xs text-[#6B7280] uppercase tracking-widest font-medium">Drop</p>
<p class="text-sm font-semibold text-[#1E1B2E] line-clamp-1">Hauz Khas Social, New Delhi</p>
</div>
</div>
</div>
<!-- Wait Pill -->
<div class="bg-surface-container-low px-4 py-1.5 rounded-full mb-8">
<p class="text-xs font-medium text-[#6B7280]">Estimated wait: ~2 mins</p>
</div>
<!-- Cancel Button -->
<button class="w-full py-4 border-2 border-error text-error rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-lg" data-icon="close">close</span>
                Cancel Search
            </button>
</section>
</main>
<!-- Navigation Shell (BottomNavBar Logic - Suppressed per focus journey rule, but template available) -->
<!-- Suppressed for search focus -->
