<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SOS Settings - Sakhi App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed-dim": "#ffb784",
              "on-tertiary-container": "#ffe0cd",
              "on-primary-container": "#25005a",
              "tertiary-fixed": "#ffdcc6",
              "surface-container-lowest": "#ffffff",
              "secondary-container": "#e8ddff",
              "on-surface-variant": "#4a4455",
              "on-primary-fixed": "#25005a",
              "on-primary": "#ffffff",
              "surface-container": "#f4f0f9",
              "surface-container-highest": "#e5e0ef",
              "surface-bright": "#fcf8ff",
              "surface-dim": "#dcd8e6",
              "surface-container-low": "#f8f5fe",
              "on-secondary-fixed": "#21005e",
              "primary": "#C0A6D6",
              "error-container": "#ffdad6",
              "on-background": "#1c1a25",
              "on-secondary": "#ffffff",
              "on-primary-fixed-variant": "#5a00c6",
              "surface-tint": "#C0A6D6",
              "primary-fixed": "#f1e9ff",
              "on-secondary-fixed-variant": "#4f319c",
              "on-error-container": "#93000a",
              "inverse-on-surface": "#f3eefd",
              "surface-variant": "#e5e0ef",
              "error": "#ba1a1a",
              "tertiary-container": "#a15100",
              "surface-container-high": "#ebe6f5",
              "secondary-fixed": "#e8ddff",
              "primary-container": "#C0A6D6",
              "on-tertiary-fixed": "#301400",
              "on-error": "#ffffff",
              "inverse-surface": "#312f3a",
              "background": "#fcf8ff",
              "outline-variant": "#ccc3d8",
              "on-secondary-container": "#3f1e8c",
              "on-surface": "#1c1a25",
              "tertiary": "#7d3d00",
              "secondary-fixed-dim": "#cebdff",
              "inverse-primary": "#d2bbff",
              "on-tertiary": "#ffffff",
              "secondary": "#674bb5",
              "surface": "#fcf8ff",
              "primary-fixed-dim": "#d2bbff",
              "outline": "#7b7487",
              "on-tertiary-fixed-variant": "#713700"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            background-color: #F8F5FF;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .tonal-shift-via-white-surface {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 245, 255, 0.8) 100%);
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#F8F5FF]/80 backdrop-blur-xl shadow-[0_16px_32px_rgba(192,166,214,0.12)]">
<div class="flex items-center px-6 h-16 w-full">
<button class="mr-4 active:scale-95 transition-transform text-[#C0A6D6]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight text-[#1E1B2E]">SOS Settings</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-6 max-w-[390px] mx-auto min-h-screen">
<!-- Header Subtext Section -->
<div class="mb-8">
<p class="text-[#6B7280] text-sm leading-relaxed">Customise your SOS alert behaviour</p>
</div>
<!-- Central Settings Card -->
<div class="bg-surface-container-lowest rounded-[16px] shadow-[0_16px_32px_rgba(192,166,214,0.08)] overflow-hidden">
<!-- Section: Alert Behaviour -->
<div class="p-6">
<h2 class="text-[#1E1B2E] font-bold text-lg mb-6">Alert Behaviour</h2>
<div class="space-y-8">
<!-- Row 1: Auto-send -->
<div class="flex items-start justify-between gap-4">
<div class="flex-1">
<p class="text-[#1E1B2E] font-semibold">Auto-send after 5 seconds</p>
<p class="text-[#6B7280] text-xs mt-1">SOS auto-sends if you don't cancel</p>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#C0A6D6]"></div>
</div>
</div>
<!-- Row 2: Vibrate -->
<div class="flex items-center justify-between gap-4">
<p class="text-[#1E1B2E] font-semibold">Vibrate on SOS trigger</p>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#C0A6D6]"></div>
</div>
</div>
<!-- Row 3: Sound -->
<div class="flex items-center justify-between gap-4">
<p class="text-[#1E1B2E] font-semibold">Play alert sound</p>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#C0A6D6]"></div>
</div>
</div>
</div>
</div>
<!-- Divider -->
<div class="h-[1px] bg-[#EADDFF] mx-6"></div>
<!-- Section: Who Gets Notified -->
<div class="p-6">
<h2 class="text-[#1E1B2E] font-bold text-lg mb-6">Who Gets Notified</h2>
<div class="space-y-6">
<!-- Emergency Contacts -->
<button class="w-full flex items-center justify-between active:scale-[0.98] transition-transform">
<div class="flex flex-col items-start">
<p class="text-[#1E1B2E] font-semibold">Emergency Contacts</p>
<span class="text-[#C0A6D6] text-xs font-semibold bg-[#F1E9FF] px-2 py-0.5 rounded-full mt-1">3 saved</span>
</div>
<span class="material-symbols-outlined text-[#6B7280]" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Safety Team -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<p class="text-[#1E1B2E] font-semibold">Sakhi Safety Team</p>
<span class="material-symbols-outlined text-xs text-[#6B7280]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Always notified</span>
</div>
</div>
</div>
<!-- Divider -->
<div class="h-[1px] bg-[#EADDFF] mx-6"></div>
<!-- Section: Test SOS -->
<div class="p-6">
<h2 class="text-[#1E1B2E] font-bold text-lg mb-4">Test SOS</h2>
<div class="border-2 border-[#C0A6D6]/30 bg-[#C0A6D6]/5 rounded-xl p-4 flex flex-col items-center text-center">
<button class="w-full py-3 px-6 rounded-lg border-2 border-[#C0A6D6] text-[#C0A6D6] font-bold active:scale-95 transition-all mb-3 hover:bg-[#C0A6D6]/10">
                        Test Alert
                    </button>
<p class="text-[#6B7280] text-[11px] leading-tight">Sends test notification only — no real alert</p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl rounded-t-[24px] shadow-[0_-8px_32px_rgba(192,166,214,0.1)] flex justify-around items-center h-20 px-4 pb-safe z-50">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-[#6B7280] hover:text-[#C0A6D6] transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[10px] font-medium tracking-wider uppercase mt-1">Home</span>
</button>
<!-- Activity/Community -->
<button class="flex flex-col items-center justify-center text-[#6B7280] hover:text-[#C0A6D6] transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="text-[10px] font-medium tracking-wider uppercase mt-1">Community</span>
</button>
<!-- Safety (ACTIVE) -->
<button class="flex flex-col items-center justify-center text-[#C0A6D6] font-bold active:scale-90">
<span class="material-symbols-outlined" data-icon="shield_with_heart" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
<span class="text-[10px] tracking-wider uppercase mt-1">Safety</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-[#6B7280] hover:text-[#C0A6D6] transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[10px] font-medium tracking-wider uppercase mt-1">Profile</span>
</button>
</nav>
</body></html>
