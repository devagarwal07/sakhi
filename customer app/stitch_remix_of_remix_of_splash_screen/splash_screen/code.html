<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .splash-gradient {
            background: linear-gradient(180deg, #F5F0FF 0%, #EDE9FE 100%);
        }
        .lotus-shape {
            clip-path: path('M50 0 C60 20 90 30 100 50 C90 70 60 80 50 100 C40 80 10 70 0 50 C10 30 40 20 50 0');
        }
        @keyframes progress-loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress {
            animation: progress-loading 3s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface font-body overflow-hidden">
<!-- Splash Screen Wrapper -->
<main class="splash-gradient h-screen w-full flex flex-col items-center justify-between py-24 px-8 relative">
<!-- Center Brand Cluster -->
<div class="flex-1 flex flex-col items-center justify-center space-y-8">
<!-- Stylized Logo Container -->
<div class="relative group">
<!-- Soft Lavender Shadow from Design System -->
<div class="absolute inset-0 bg-primary/20 blur-[32px] rounded-full transform translate-y-4"></div>
<div class="relative w-32 h-32 bg-primary flex items-center justify-center shadow-[0_16px_32px_rgba(124,58,237,0.2)]" style="clip-path: polygon(50% 0%, 83% 12%, 100% 43%, 94% 78%, 68% 100%, 32% 100%, 6% 78%, 0% 43%, 17% 12%);">
<span class="text-white text-6xl font-poppins font-bold select-none">S</span>
</div>
</div>
<!-- Identity Text -->
<div class="text-center space-y-3">
<h1 class="text-5xl font-poppins font-bold text-on-background tracking-tighter">
                    Sakhi
                </h1>
<p class="text-secondary font-light text-lg tracking-wide">
                    Safe Rides, Every Time
                </p>
</div>
</div>
<!-- Editorial Spacing Layer -->
<div class="w-full max-w-[200px] flex flex-col items-center space-y-12">
<!-- Abstract Pattern for Brand Continuity -->
<div class="opacity-20 flex space-x-2">
<div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
</div>
<!-- Loading Indicator -->
<div class="w-full space-y-4">
<div class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary animate-progress rounded-full"></div>
</div>
<p class="text-[10px] font-label uppercase tracking-[0.2em] text-outline text-center">
                    Empowering Women
                </p>
</div>
</div>
<!-- Decorative Background Elements (Luminous Layers) -->
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-primary/5 rounded-full blur-[80px]"></div>
<div class="absolute bottom-[5%] right-[-10%] w-80 h-80 bg-secondary/10 rounded-full blur-[100px]"></div>
</main>
